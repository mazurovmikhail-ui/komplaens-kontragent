<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Комплаенс-проверка контрагента — рабочее место</title>
<style>
  :root{
    --paper:#eef0f4; --surface:#ffffff; --surface-2:#f6f7fa;
    --ink:#1a1d26; --muted:#5b6270; --faint:#8b91a0;
    --line:#d7dbe3; --line-strong:#c2c7d2;
    --accent:#234b8a; --accent-ink:#1c3d70; --accent-soft:#e7eef8;
    --good:#1c7a4d; --good-soft:#e2f2ea;
    --warn:#8a5a10; --warn-soft:#f6ecd8;
    --crit:#9e2a20; --crit-soft:#f7e4e2;
    --serif:Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",monospace;
    --sh:0 1px 2px rgba(20,25,40,.05),0 6px 20px rgba(20,25,40,.05);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0f1218; --surface:#171b23; --surface-2:#1d222c;
      --ink:#e7eaf1; --muted:#9aa2b3; --faint:#6b7384;
      --line:#2a2f3b; --line-strong:#3a414f;
      --accent:#7ea6e8; --accent-ink:#9cbcf0; --accent-soft:#1a2740;
      --good:#57c48b; --good-soft:#132a20;
      --warn:#d3a24e; --warn-soft:#2c2412;
      --crit:#e6796d; --crit-soft:#2e1715;
      --sh:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1218; --surface:#171b23; --surface-2:#1d222c;
    --ink:#e7eaf1; --muted:#9aa2b3; --faint:#6b7384;
    --line:#2a2f3b; --line-strong:#3a414f;
    --accent:#7ea6e8; --accent-ink:#9cbcf0; --accent-soft:#1a2740;
    --good:#57c48b; --good-soft:#132a20;
    --warn:#d3a24e; --warn-soft:#2c2412;
    --crit:#e6796d; --crit-soft:#2e1715;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--accent)}
  h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.25; margin:0}
  h1{font-size:21px}
  h2{font-size:18px; margin-bottom:10px}
  h3{font-size:15px; font-family:var(--sans); font-weight:650; margin-bottom:6px}
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px 80px}

  /* ---- шапка ---- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:var(--surface); border-bottom:1px solid var(--line);
    box-shadow:var(--sh);
  }
  .top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
  .brand small{color:var(--faint);font-size:11.5px;letter-spacing:.02em}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
    padding:6px 13px; border-radius:999px; cursor:pointer; font-size:13.5px; font-family:inherit;
  }
  .tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  .icon-btn{
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1
  }

  /* ---- сетка ---- */
  .cols{display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:18px; align-items:start; margin-top:18px}
  @media (max-width:960px){ .cols{grid-template-columns:minmax(0,1fr)} .side{position:static !important} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--sh); padding:16px 18px; margin-bottom:14px}
  .card > .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .card > .hd .ref{color:var(--faint);font-size:12px}
  .side{position:sticky; top:64px}

  /* ---- формы ---- */
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
  input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{
    font:inherit; font-size:14px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%;
  }
  textarea{min-height:64px;resize:vertical;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink);padding:5px 0;cursor:pointer}
  .chk input{margin-top:3px;flex:0 0 auto;accent-color:var(--accent)}
  .hint{color:var(--faint);font-size:12px;margin-top:4px}
  .btn{
    font:inherit;font-size:13.5px;border-radius:9px;padding:8px 14px;cursor:pointer;
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--crit);border-color:var(--crit)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* ---- бейджи ---- */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-base{background:var(--good-soft);color:var(--good)}
  .b-std{background:var(--warn-soft);color:var(--warn)}
  .b-deep{background:var(--crit-soft);color:var(--crit)}
  .b-off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .b-acc{background:var(--accent-soft);color:var(--accent-ink)}

  /* ---- сводка ---- */
  .sum-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .sum-line:last-child{border-bottom:0}
  .sum-line span:first-child{color:var(--muted)}
  .sum-line span:last-child{text-align:right;font-weight:600}
  .verdict{border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
  .v-ok{background:var(--good-soft);color:var(--good)}
  .v-cond{background:var(--warn-soft);color:var(--warn)}
  .v-neg{background:var(--crit-soft);color:var(--crit)}
  .v-off{background:var(--surface-2);color:var(--muted)}
  .verdict b{display:block;font-size:14.5px;margin-bottom:3px}

  /* ---- шаги ---- */
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .step{
    border:1px solid var(--line);background:var(--surface);border-radius:9px;
    padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted);display:flex;gap:7px;align-items:center;font-family:inherit
  }
  .step[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .step .num{
    display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;
    background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:700
  }
  .step[aria-current="true"] .num{background:var(--accent);color:#fff;border-color:var(--accent)}
  .step.done .num{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}

  /* ---- чек-лист ---- */
  .ci{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:var(--surface-2)}
  .ci.f-flag{border-color:var(--warn);background:var(--warn-soft)}
  .ci.f-over{border-color:var(--crit);background:var(--crit-soft)}
  .ci.f-abs{border-color:var(--crit);background:var(--crit-soft);box-shadow:inset 3px 0 0 var(--crit)}
  .ci .ci-hd{display:flex;gap:9px;align-items:baseline}
  .ci .n{font-family:var(--mono);font-size:12px;color:var(--faint);flex:0 0 26px}
  .ci .what{font-size:13.5px;flex:1}
  .ci .src{font-size:11.5px;color:var(--faint);margin:5px 0 8px 35px}
  .ci .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-left:35px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
  .seg label{padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
  .seg label:last-child{border-right:0}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg input:checked + span{font-weight:700}
  .seg label:has(input:checked){background:var(--accent-soft);color:var(--accent-ink)}
  .seg label.w:has(input:checked){background:var(--warn-soft);color:var(--warn)}
  .seg label.c:has(input:checked){background:var(--crit-soft);color:var(--crit)}
  .ci textarea{margin:8px 0 0 35px;width:calc(100% - 35px);min-height:44px;font-size:13px;background:var(--surface)}
  .need{color:var(--crit);font-size:11.5px;margin:4px 0 0 35px}

  /* ---- таблицы ---- */
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  table.t th{background:var(--surface-2);font-weight:650;font-size:12.5px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  tr.exp{background:var(--crit-soft)}

  ul.tight{margin:6px 0 0;padding-left:20px}
  ul.tight li{margin-bottom:4px;font-size:13.5px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .pill{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-family:var(--mono)}
  .hidden{display:none !important}
  .doc{font-family:var(--serif);font-size:14px;line-height:1.5}
  .doc h4{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:13.5px;
    z-index:99;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .18s
  }
  .toast.on{opacity:1}

  /* ---- роль ---- */
  .role{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface-2)}
  .role button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .role button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  /* ---- строки запроса и договоров ---- */
  .rq{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
  .rq:last-of-type{border-bottom:0}
  .rq > input[type=checkbox]{margin-top:9px;flex:0 0 auto;accent-color:var(--accent)}
  .rq .body{flex:1;min-width:0}
  .rq textarea{min-height:36px;font-size:13.5px;resize:none;overflow:hidden}
  .rq.off textarea{opacity:.5}
  .opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer;background:var(--surface-2);font-size:13.5px}
  .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .opt input{margin-top:3px;accent-color:var(--accent)}
  .letter{font-family:var(--serif);font-size:14px;line-height:1.55;white-space:pre-wrap;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--surface-2)}

  @media print{
    header.top,.steps,.side,.btnrow,.noprint{display:none !important}
    body{background:#fff;color:#000}
    .card{border:0;box-shadow:none;padding:0;margin:0}
    .wrap{max-width:none;padding:0}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Комплаенс-проверка контрагента</h1>
      <small>Стадия 0 договорной работы · ГК «С.АН ГРУПП»</small>
    </div>
    <div class="role" id="role" title="Кто работает с приложением">
      <button data-role="init" aria-pressed="false">Инициатор</button>
      <button data-role="km" aria-pressed="true">Комплаенс-менеджер</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="check" aria-selected="true">Проверка</button>
      <button class="tab" role="tab" data-view="registry" aria-selected="false">Реестр</button>
      <button class="tab" role="tab" data-view="orgs" aria-selected="false">Настройки</button>
      <button class="tab" role="tab" data-view="help" aria-selected="false">Справка</button>
    </div>
    <button class="icon-btn" id="theme" title="Тема">◐</button>
  </div>
</header>

<div class="wrap">

<!-- ============ ПРОВЕРКА ============ -->
<div id="v-check">
  <div class="steps" id="steps"></div>
  <div class="cols">
    <div>
      <section id="s1" class="stepbody"></section>
      <section id="s2" class="stepbody hidden"></section>
      <section id="s3" class="stepbody hidden"></section>
      <section id="s4" class="stepbody hidden"></section>
      <section id="s5" class="stepbody hidden"></section>
      <section id="s6" class="stepbody hidden"></section>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>

<!-- ============ РЕЕСТР ============ -->
<div id="v-registry" class="hidden"></div>

<!-- ============ ПОРОГИ ============ -->
<div id="v-orgs" class="hidden"></div>

<!-- ============ СПРАВКА ============ -->
<div id="v-help" class="hidden"></div>

</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ======================================================================
   Данные Регламента о порядке проведения комплаенс-проверки контрагентов
   (проверки должной осмотрительности) в ГК «С.АН ГРУПП».
   Все ссылки на пункты и приложения — на этот Регламент.
   ====================================================================== */

const LS = {orgs:'kpk.orgs.v1', reg:'kpk.registry.v1', draft:'kpk.draft.v1', theme:'kpk.theme',
            excl:'kpk.excl.v1', role:'kpk.role', api:'kpk.api.checko'};

/* Приложение № 2 — пороговые значения. В коде не хранятся:
   вносятся на вкладке «Пороги» и остаются в браузере пользователя. */
const ORGS_DEFAULT = [];

/* Предмет договора. lvl — минимальный уровень по Приложению № 1;
   sk — строительный блок (п. 4.6: проверка независимо от суммы, уровень не ниже стандартного). */
const SUBJECTS = [
  {v:'postavka-raz', t:'Разовая поставка ТМЦ',                                   lvl:1, sk:false},
  {v:'uslugi-prost', t:'Простые услуги',                                          lvl:1, sk:false},
  {v:'postavka-reg', t:'Регулярные закупки, поставка материалов',                 lvl:2, sk:false},
  {v:'oborud',       t:'Поставка оборудования',                                   lvl:2, sk:false, teh:true},
  {v:'arenda',       t:'Аренда',                                                  lvl:2, sk:false},
  {v:'uslugi',       t:'Возмездное оказание услуг, агентские, консультационные',  lvl:2, sk:false},
  {v:'samozan',      t:'Договор с самозанятым или ИП',                            lvl:2, sk:false},
  {v:'podryad',      t:'Генподряд, подряд, субподряд, СМР',                       lvl:2, sk:true,  teh:true},
  {v:'proekt',       t:'Проектные и изыскательские работы',                       lvl:2, sk:true,  teh:true},
  {v:'tehzak',       t:'Функции технического заказчика',                          lvl:2, sk:true,  teh:true},
  {v:'nedvizh', noPorog:true,      t:'Купля-продажа недвижимости или земельного участка',       lvl:3, sk:false},
  {v:'zaim', noPorog:true,         t:'Заём, кредит, залог, поручительство, уступка требования', lvl:3, sk:false},
  {v:'sovm', noPorog:true,         t:'Совместная деятельность, инвестиционный договор',         lvl:3, sk:false},
];

/* Приложение № 5 — чек-лист комплаенс-проверки */
const CHECKLIST = [
  {n:1,  p:1, t:'Государственная регистрация, статус, дата создания, ОКВЭД, размер уставного капитала', s:'ЕГРЮЛ / ЕГРИП', u:'https://egrul.nalog.ru/'},
  {n:2,  p:1, t:'Записи о недостоверности сведений (адрес, руководитель, участники)', s:'ЕГРЮЛ', u:'https://egrul.nalog.ru/'},
  {n:3,  p:1, t:'Решение о предстоящем исключении из ЕГРЮЛ, о ликвидации, о реорганизации', s:'ЕГРЮЛ', u:'https://egrul.nalog.ru/'},
  {n:4,  p:1, t:'Полномочия подписанта: устав, решение об избрании, доверенность, срок полномочий', s:'Документы контрагента', u:''},
  {n:5,  p:1, t:'Необходимость корпоративного одобрения (крупная сделка, сделка с заинтересованностью) и его наличие', s:'Устав, отчётность контрагента', u:''},
  {n:6,  p:1, t:'Дисквалификация руководителя; «массовые» руководители и учредители; адрес массовой регистрации', s:'«Прозрачный бизнес», реестр дисквалифицированных лиц', u:'https://pb.nalog.ru/'},
  {n:7,  p:1, t:'Включение контрагента, его руководителя и участников в перечни Росфинмониторинга (экстремизм, терроризм, ФРОМУ)', s:'fedsfm.ru', u:'https://www.fedsfm.ru/'},
  {n:8,  p:1, t:'Включение в санкционные перечни (при иностранном элементе и трансграничных расчётах)', s:'Открытые санкционные перечни, сведения банка', u:''},
  {n:9,  p:1, t:'Судебные споры: количество, суммы, роль (истец / ответчик), споры по качеству и срокам', s:'kad.arbitr.ru, sudrf.ru', u:'https://kad.arbitr.ru/'},
  {n:10, p:1, t:'Исполнительные производства: количество, суммы, предмет взыскания', s:'Банк данных исполнительных производств ФССП', u:'https://fssp.gov.ru/iss/ip'},
  {n:11, p:1, t:'Дела о банкротстве, намерения кредиторов обратиться в суд', s:'ЕФРСБ', u:'https://bankrot.fedresurs.ru/'},
  {n:12, p:1, t:'Существенные факты: залог долей, лизинг, изменение состава участников, уведомления кредиторов', s:'Федресурс', u:'https://fedresurs.ru/'},
  {n:13, p:1, t:'Включение в реестр недобросовестных поставщиков', s:'ЕИС закупок', u:'https://zakupki.gov.ru/epz/dishonestsupplier/search/results.html'},
  {n:14, p:1, t:'Обременения движимого имущества, передаваемого по договору', s:'Реестр уведомлений о залоге движимого имущества', u:'https://www.reestr-zalogov.ru/'},
  {n:15, p:1, t:'Права на недвижимое имущество и обременения (для сделок с недвижимостью и аренды)', s:'Выписка из ЕГРН', u:'https://rosreestr.gov.ru/'},
  {n:16, p:1, t:'Лицензии, членство в СРО, допуски, наличие записей в НРС', s:'Реестры СРО, НОСТРОЙ / НОПРИЗ, реестры лицензий', u:'https://nostroy.ru/'},

};
/* JSON <-> base64url для ссылок «инициатору» и «комплаенс-менеджеру». Данные едут во фрагменте
   адреса (#…), который браузер на сервер не отправляет. */
function pack(obj){
  const b = new TextEncoder().encode(JSON.stringify(obj)); let bin=''; b.forEach(c=>bin+=String.fromCharCode(c));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unpack(str){
  const bin = atob(str.replace(/-/g,'+').replace(/_/g,'/')); const b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(b));
}
function baseUrl(){ return location.href.split('#')[0]; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1900); }
function addMonths(iso,m){ const d=new Date(iso); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Скопировано в буфер обмена'), ()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Скопировано в буфер обмена'); }catch(e){ toast('Скопировать не удалось'); }
  document.body.removeChild(ta);
}
function download(name, text, mime){
  try{
    const b=new Blob(['﻿'+text],{type:mime||'text/plain;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
  }catch(e){ toast('Скачивание недоступно — используйте копирование'); }
}

/* ====================== расчёт по Регламенту ====================== */
function calc(){
  const o = org(), sj = subj();
  const own = Number(S.sum)||0;
  /* п. 4.4 — сумма считается по совокупности взаимосвязанных сделок; действующие договоры,
     отмеченные как взаимосвязанные, прибавляются к сумме новой сделки */
  const contracts = S.hasContracts==='yes' ? (S.contracts||[]) : [];
  const linked = contracts.filter(c=>c.linked).reduce((a,c)=>a+(Number(c.sum)||0),0);
  const sum = own + linked;
  const avans = Number(S.avans)||0;
  const r = {org:o, subj:sj, sum, own, linked, contracts, avans};
  r.contractsTotal = contracts.reduce((a,c)=>a+(Number(c.sum)||0),0);

  /* --- нужна ли проверка (пп. 4.5–4.7) --- */
  r.p46 = [];
  if(sj.sk) r.p46.push('Подрядные, строительно-монтажные, проектные и изыскательские работы, функции техзаказчика — проверка независимо от суммы (п. 4.6)');
  (S.p46||[]).forEach(k=>r.p46.push(k));

  r.exclListed = (!S.excl && S.excl!=='none') ? exclMatch() : null;
  r.excl = (S.excl && S.excl!=='none') ? S.excl : (r.exclListed ? r.exclListed.kind : '');
  r.skip = false; r.skipWhy = ''; r.exclSkip = false;
  if(r.excl && r.p46.length) r.condSkip = 'Исключение выбрано, но к сделке оно не применяется: есть основание проверки независимо от суммы (п. 4.6). Проверка проводится.';
  if(r.excl && !r.p46.length){
    r.skip = true; r.exclSkip = true;
    r.skipWhy = r.excl === 'intragroup'
      ? 'Внутригрупповая сделка (пп. 4 п. 4.7). Проверка не проводится; комплаенс-менеджер с привлечением финансового департамента подтверждает соответствие цены принципу «вытянутой руки» и оформляет Заключение в сокращённой форме.'
      : 'Сделка отнесена к исключениям п. 4.7. Основание фиксируется инициатором в листе согласования со ссылкой на подпункт п. 4.7 и приказ организации об установлении порогов.';
  } else if(!r.p46.length && sum <= o.porog){
    const payOk = (S.pay === 'fact' || S.pay === 'cp-prepay') && !sj.noPorog;
    if(sj.noPorog){
      r.condSkip = 'Сумма не превышает порог, но исключение пп. 1 п. 4.7 к такой сделке неприменимо: оно обусловлено оплатой по факту поставки (выполнения) либо предоплатой со стороны контрагента, а по займу, залогу, поручительству, уступке, сделке с недвижимостью и совместной деятельности такое условие не устанавливается. Проверка проводится.';
    }
    if(payOk){
      r.skip = true;
      r.skipWhy = `Сумма ${money(sum)} ₽ не превышает порог проверки ${money(o.porog)} ₽ для ${o.name}, оплата — ${S.pay==='fact'?'по факту':'предоплата со стороны контрагента'} (пп. 1 п. 4.7).`;
    } else {
      r.condSkip = `Сумма не превышает порог, но условие пп. 1 п. 4.7 не выполнено: предусмотрен аванс со стороны организации Группы. Проверка проводится.`;
    }
  }

  /* --- уровень риска (Приложение № 1, пп. 5.2–5.3) --- */
  const parts = [];
  let bySum = 1;
  if(sum > o.std) bySum = 3; else if(sum > o.base) bySum = 2; else bySum = 1;
  parts.push({k:'Сумма сделки', v:bySum, note:`${money(sum)} ₽${linked?` (${money(own)} + ${money(linked)} по взаимосвязанным действующим договорам)`:''} при границах ${money(o.base)} / ${money(o.std)} ₽`});
  parts.push({k:'Предмет договора', v:sj.lvl, note:sj.t});
  const byHist = S.hist==='>2' ? 1 : (S.hist==='0.5-2' ? 2 : 3);
  parts.push({k:'История сотрудничества', v:byHist, note:{'>2':'Более 2 лет без замечаний','0.5-2':'От 6 месяцев до 2 лет','new':'Новый контрагент либо замечания по исполнению'}[S.hist]});
  const byAge = S.age==='>3' ? 1 : (S.age==='1-3' ? 2 : 3);
  parts.push({k:'Срок деятельности', v:byAge, note:{'>3':'Более 3 лет','1-3':'От 1 года до 3 лет','<1':'Менее 1 года'}[S.age]});
  let byPay = 1;
  if(S.fin==='project') byPay = 3; else if(avans > 30) byPay = 3; else if(avans > 0) byPay = 2;
  parts.push({k:'Расчёты', v:byPay, note:(S.fin==='project'?'Проектное финансирование; ':'') + (avans>0?`аванс ${avans} %`:'оплата по факту / постоплата')});

  let lvl = Math.max(...parts.map(p=>p.v));
  const forced = [];
  if(sj.sk && lvl < 2){ lvl = 2; forced.push('Подрядные, СМР, проектные и изыскательские работы, техзаказчик — уровень не ниже стандартного (п. 4.6)'); }

  /* п. 5.3 — углублённый независимо от суммы */
  const p53 = [];
  if(sj.sk && sum > o.base) p53.push(`СМР, проектирование, изыскания или функции техзаказчика при сумме свыше верхней границы базового уровня (${money(o.base)} ₽)`);
  if(S.fin==='project') p53.push('Оплата за счёт средств целевого банковского кредита (проектного финансирования)');
  if(avans > 30) p53.push('Авансирование свыше 30 % цены договора');
  if(S.age==='<1') p53.push('Контрагент зарегистрирован менее 12 месяцев назад');
  if(S.noexp) p53.push('Отсутствие подтверждённого опыта по предмету договора');
  if(S.affil) p53.push('Взаимозависимость или аффилированность с организацией Группы, её участниками или руководителями');
  if(S.foreign) p53.push('Сделка с иностранным элементом либо трансграничные платежи');
  const nFlags = (S.flags||[]).length;
  if(nFlags >= 2) p53.push(`Выявлено ${nFlags} красных флага (два и более)`);
  if(p53.length){ lvl = 3; }
  r.p53 = p53;
  r.forced = forced;
  r.parts = parts;

  r.lvlAuto = lvl;
  r.lvl = Math.max(lvl, Number(S.lvlManual)||0);
  r.raised = r.lvl > r.lvlAuto;

  /* --- объём и сроки --- */
  r.scope   = SCOPE[r.lvl];
  r.days    = LVL_DAYS[r.lvl];
  r.opinion = LVL_OPIN[r.lvl];
  r.valid   = LVL_VALID[r.lvl];
  r.anketa  = r.lvl === 1 ? 'Форма А (краткая)' : 'Форма Б (расширенная)';
  r.blocks  = r.lvl === 1 ? ['A'] : (r.lvl === 2 ? ['A','B'] : ['A','B','V']);
  r.nalog   = r.lvl === 1 ? 'Рекомендуется' : 'Обязательна (п. 12.5)';
  r.vyezd   = r.lvl === 1 ? 'Не требуется'
            : r.lvl === 2 ? 'По решению комплаенс-менеджера'
            : 'Обязателен для нового подрядчика, крупной подрядной сделки либо при сомнениях в ресурсах; для ранее проверенного — по решению КМ или техзаказчика. С фотофиксацией и актом осмотра';

  /* --- квалификации из чек-листа и Приложения № 6 --- */
  const abs = [], over = [], flag = [];
  r.scope.forEach(n=>{
    const c = S.cl[n];
    if(!c || !c.q || c.q==='ok') return;
    const item = CHECKLIST.find(x=>x.n===n);
    const rec = {src:`Чек-лист, поз. ${n}`, t:item.t, why:c.note||''};
    if(c.q==='abs') abs.push(rec); else if(c.q==='over') over.push(rec); else flag.push(rec);
  });
  CRIT.forEach(c=>{
    const q = S.crit[c.n];
    if(!q || q==='no') return;
    const rec = {src:`Приложение № 6, п. ${c.n}`, t:c.t, why:(S.crit[c.n+'_why']||'')};
    if(q==='abs') abs.push(rec); else if(q==='over') over.push(rec); else flag.push(rec);
  });
  (S.flags||[]).forEach(n=>{
    const f = FLAGS.find(x=>x.n===n);
    if(f) flag.push({src:`Приложение № 6, красный флаг ${n}`, t:f.t, why:''});
  });
  r.abs = abs; r.over = over; r.flag = flag;

  /* --- профильные мнения (п. 6.4) --- */
  const need = [];
  if(r.lvl===3) need.push({d:'Юридический департамент', why:'углублённый уровень риска'});
  else if(abs.length||over.length) need.push({d:'Юридический департамент', why:'выявлен стоп-фактор'});
  const finFlag = r.scope.some(n=>{ const c=S.cl[n]; const it=CHECKLIST.find(x=>x.n===n); return it && it.fin && c && c.q && c.q!=='ok'; });
  if(r.lvl===3) need.push({d:'Финансовый департамент', why:'углублённый уровень риска'});
  else if(S.intragroup || r.excl==='intragroup') need.push({d:'Финансовый департамент', why:'внутригрупповая сделка'});
  else if(finFlag) need.push({d:'Финансовый департамент', why:'красные флаги налогового или финансового характера'});
  if(r.lvl===3 && (sj.sk || sj.teh)) need.push({d:'Технический заказчик', why:'подряд, проектирование или поставка оборудования при углублённом уровне'});
  r.need = need;

  /* --- меры митигации --- */
  const groups = new Set();
  (S.flags||[]).forEach(n=>{ const f=FLAGS.find(x=>x.n===n); if(f) groups.add(f.m); });
  if(S.affil || S.crit[13] && S.crit[13]!=='no') groups.add('AFF');
  if(S.foreign) groups.add('FOR');
  if(r.lvl>=2) groups.add('TAX');
  if(S.age==='<1' || S.noexp) groups.add('NEW');
  r.mit = [...groups].map(g=>({g, t:MIT[g]}));

  r.done = r.scope.filter(n=>S.cl[n] && S.cl[n].q).length;

  /* --- вывод (п. 7.9) --- */
  if(r.skip){
    r.verdict = 'skip';
    r.verdictText = 'Комплаенс-проверка не требуется';
  } else if(abs.length){
    r.verdict = 'neg';
    r.verdictText = 'Отрицательное. Абсолютный стоп-фактор';
    r.verdictWhy = 'Заключение договора не допускается до устранения обстоятельства либо прекращения установленного законом запрета. Управленческим решением по п. 8.3 абсолютный стоп-фактор не преодолевается.';
  } else if(over.length){
    r.verdict = 'neg';
    r.verdictText = 'Отрицательное либо с условиями. Преодолимый стоп-фактор';
    r.verdictWhy = 'Передача договора на согласование допускается после устранения фактора либо по письменному мотивированному решению уполномоченного лица (п. 8.3).';
    r.needP83 = true;
    r.needPartner = r.lvl===3 || over.length>=2;
  } else if(r.done < r.scope.length){
    r.verdict = 'draft';
    r.verdictText = 'Проверка не завершена';
    r.verdictWhy = `Заполнено ${r.done} позиций чек-листа из ${r.scope.length}. Непроведение проверки в срок не означает положительного Заключения и не позволяет запускать договор на согласование (п. 8.6).`;
  } else if(flag.length || r.mit.length){
    r.verdict = 'cond';
    r.verdictText = 'С условиями (митигация)';
    r.verdictWhy = 'Контрагент допускается к заключению договора при включении в него условий, указанных в Заключении.';
  } else {
    r.verdict = 'ok';
    r.verdictText = 'Без замечаний';
    r.verdictWhy = 'Контрагент допускается к заключению договора на стандартных условиях.';
  }

  /* --- обоснования (Приложение № 5: оценочные понятия не применяются автоматически) --- */
  r.missing = [];
  r.scope.forEach(n=>{
    const c = S.cl[n];
    if(c && c.q && c.q!=='ok' && !(c.note||'').trim()) r.missing.push(`поз. ${n} чек-листа`);
  });
  CRIT.forEach(c=>{ const q=S.crit[c.n]; if(q && q!=='no' && !((S.crit[c.n+'_why']||'').trim())) r.missing.push(`Прил. № 6, п. ${c.n}`); });

  r.validUntil = S.date ? addMonths(S.date, r.valid) : '';
  return r;
}

/* ====================== рендер: шаги ====================== */
const STEPS = ['Сделка','Запрос документов','Чек-лист','Стоп-факторы','Митигация','Заключение'];
const INIT_STEPS = 2;   /* инициатору доступны «Сделка» и «Запрос документов» */
function renderSteps(){
  const r = calc();
  document.getElementById('steps').innerHTML = STEPS.map((t,i)=>{
    const n=i+1;
    if(ROLE==='init' && n>INIT_STEPS) return '';
    let done=false;
    if(n===1) done = !!(S.cp && S.subj && (S.sum || r.exclSkip));
    if(n===2) done = step>2;
    if(n===3) done = r.done === r.scope.length && r.scope.length>0;
    if(n===4) done = step>4;
    if(n===5) done = step>5;
    return `<button class="step ${done?'done':''}" data-step="${n}" aria-current="${step===n}"><span class="num">${done?'✓':n}</span>${t}</button>`;
  }).join('');
}

  return m;
}

/* ====================== шаг 2 — запрос документов ====================== */
function reqItems(){
  const r = calc(), out = [];
  r.blocks.forEach(b=>DOCS[b].forEach((d,i)=>{
    const key = b+i;
    let on = d.on;
    if(d.deep && r.lvl===3) on = true;
    if(d.sk && !r.subj.sk) on = false;
    if(S.req.sel[key] !== undefined) on = !!S.req.sel[key];
    const t = S.req.edit[key] !== undefined ? S.req.edit[key] : d.t;
    out.push({key, block:b, on, t, km:d.km, anketa:!!d.anketa, edited:S.req.edit[key]!==undefined});
  }));
  return out;
}
function reqLines(){
  const list = reqItems().filter(x=>x.on && x.t.trim()).map(x=>x.t.trim());
  (S.req.extra||[]).forEach(x=>{ if((x.t||'').trim()) list.push(x.t.trim()); });
  return list.map(t=>t.replace(/[.;]+$/,''));
}
function reqParts(){
  const r = calc();
  const subject = r.subj.v ? r.subj.t.charAt(0).toLowerCase()+r.subj.t.slice(1) : '';
  const due = S.req.due ? `до ${rus(S.req.due)}` : '';
  const to  = (S.req.to||'').trim() ? `на адрес ${S.req.to.trim()}` : '';
  const where = [due,to].filter(Boolean).join(' ') || 'в ответ на это письмо';
  return {
    head:[`Кому: ${S.cp||'____________'}${S.inn?`, ИНН ${S.inn}`:''}`, `От: ${orgName()}`, `Дата: ${rus(today())}`],
    intro:`Готовим к заключению договор${subject?` (${subject})`:''}. Чтобы согласовать его, просим направить следующие документы и сведения.`,
    list:reqLines(),
    tail:[
      `Документы просим направить ${where}.`,
      'Документы должны быть не старше 3 месяцев на дату представления, если в перечне не указано иное.',
      'Выписку из ЕГРЮЛ, бухгалтерскую отчётность и другие сведения, которые есть в открытых источниках, присылать не нужно.',
    ],
    sign:(S.req.sign||'').trim() || S.initiator || '____________',
  };
}
function reqText(){
  const p = reqParts();
  return ['Запрос документов','',...p.head,'','Добрый день!','',p.intro,'',...p.list.map((t,i)=>`${i+1}. ${t}${i===p.list.length-1?'.':';'}`),'',...p.tail,'','С уважением,',p.sign].join('\n');
}
function reqDocHtml(){
  const p = reqParts(), P = t=>`<p style="margin:0 0 8pt">${esc(t)}</p>`;
  return `<html><head><meta charset="utf-8"><title>Запрос документов</title></head><body style="font-family:'Times New Roman',serif;font-size:12pt;line-height:1.35">
<p style="text-align:center;font-weight:bold;margin:0 0 12pt">Запрос документов</p>
${p.head.map(t=>`<p style="margin:0">${esc(t)}</p>`).join('')}
<p style="margin:12pt 0 8pt">Добрый день!</p>
${P(p.intro)}
<ol style="margin:0 0 8pt">${p.list.map((t,i)=>`<li>${esc(t)}${i===p.list.length-1?'.':';'}</li>`).join('')}</ol>
${p.tail.map(P).join('')}
<p style="margin:12pt 0 0">С уважением,<br>${esc(p.sign)}</p>
</body></html>`;
}
function fit(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }
function renderReqPreview(){
  const el = document.getElementById('rq-preview'); if(el) el.textContent = reqText();
  const c = document.getElementById('rq-count'); if(c) c.textContent = `в письме позиций: ${reqLines().length}`;
}
function renderReq(){
  const r = calc();
  if(r.skip){
    document.getElementById('s2').innerHTML = `<div class="card"><div class="verdict v-off" style="margin:0"><b>Запрос не нужен</b>Проверка по этой сделке не проводится, документы у контрагента не запрашиваются.</div></div>
    <div class="btnrow"><button class="btn ghost" data-go="1">← Сделка</button></div>`;
    return;
  }
  const items = reqItems();
  const blocks = r.blocks.map(b=>{
    const rows = items.filter(x=>x.block===b).map(x=>`<div class="rq ${x.on?'':'off'}">
      <input type="checkbox" data-rqs="${x.key}" ${x.on?'checked':''} aria-label="Включить в запрос">
      <div class="body">
        <textarea data-rqe="${x.key}" rows="1">${esc(x.t)}</textarea>
        ${x.anketa?`<div class="hint" style="color:var(--warn)">Приложите к письму бланк анкеты: ${esc(r.anketa.toLowerCase())}.</div>`:''}
        ${x.km?`<div class="hint">${esc(x.km)}. В письмо эта подсказка не попадает.</div>`:''}
        ${x.edited?`<button class="btn ghost" style="padding:1px 7px;font-size:11.5px;margin-top:4px" data-rqreset="${x.key}">вернуть исходную формулировку</button>`:''}
      </div>
    </div>`).join('');
    return `<h3 style="margin-top:14px">Блок ${BLOCK_NAME[b]}</h3>${rows}`;
  }).join('');

/* ====================== автопроверка: суды, приставы, банкротство ======================
   Картотека арбитражных дел, банк данных ФССП и ЕФРСБ не отдают данные странице из браузера:
   у них нет открытого API, а формы закрыты капчей. Поэтому сведения берутся через API Checko
   (api.checko.ru) — он собирает те же три источника и разрешает запросы из браузера.
   Ключ хранится только в localStorage комплаенс-менеджера. */
const AUTO_MARK = 'Автопроверка';
let autoBusy = false, autoErr = '';
function apiKey(){ try{ return localStorage.getItem(LS.api)||''; }catch(e){ return ''; } }
async function checko(method, params){
  const u = new URL('https://api.checko.ru/v2/'+method);
  u.searchParams.set('key', apiKey());
  Object.keys(params).forEach(k=>u.searchParams.set(k, params[k]));
  const res = await fetch(u, {referrerPolicy:'no-referrer'});
  let j = null; try{ j = await res.json(); }catch(e){}
  if(!j || !j.meta || j.meta.status!=='ok') throw new Error((j && j.meta && j.meta.message) || `сервис ответил кодом ${res.status}`);
  return j;
}
function num(v){ return Number(v)||0; }
function names(a){ return (Array.isArray(a)?a:[]).map(x=>x && x['Наим']).filter(Boolean).join(', '); }
function safeUrl(u){ return /^https:\/\//.test(String(u||'')) ? u : ''; }
function stamp(iso){ const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

async function autoCheck(){
  const inn = digits(S.inn);
  if(![10,12].includes(inn.length)){ toast('Укажите ИНН контрагента: 10 или 12 цифр'); return; }
  if(!apiKey()){ toast('Сначала внесите ключ API на вкладке «Настройки»'); return; }
  autoBusy = true; autoErr = ''; render();
  try{
    const q = {inn, sort:'-date'};
    const def = await checko('legal-cases', Object.assign({role:'defendant'}, q));
    const act = await checko('legal-cases', Object.assign({role:'defendant', active:'true', limit:'1'}, q));
    const pl  = await checko('legal-cases', Object.assign({role:'plaintiff', limit:'1'}, q));
    const enf = await checko('enforcements', q);
    const bk  = await checko('bankruptcy-messages', q);
    const who = def.company || def.entrepreneur || {};
    const enfRows = (enf.data && enf.data['Записи']) || [];
    S.auto = {
      at:new Date().toISOString(), inn,
      who:{name:who['НаимСокр']||who['НаимПолн']||who['ФИО']||'', ogrn:who['ОГРН']||who['ОГРНИП']||'', status:who['Статус']||'', reg:who['ДатаРег']||''},
      def:{n:num(def.data['ЗапВсего']), sum:num(def.data['ОбщСуммИск']),
           rows:((def.data['Записи'])||[]).slice(0,10).map(x=>({num:x['Номер'], date:x['Дата'], court:x['Суд'], sum:num(x['СуммИск']), other:names(x['Ист']), url:safeUrl(x['СтрКАД'])}))},
      act:{n:num(act.data['ЗапВсего']), sum:num(act.data['ОбщСуммИск'])},
      pl:{n:num(pl.data['ЗапВсего']), sum:num(pl.data['ОбщСуммИск'])},
      enf:{n:enfRows.length, more:num(enf.data && enf.data['СтрВсего'])>1,
           debt:enfRows.reduce((a,x)=>a+num(x['СумДолг']),0), rest:enfRows.reduce((a,x)=>a+num(x['ОстЗадолж']),0),
           rows:enfRows.slice(0,10).map(x=>({num:x['ИспПрНомер'], date:x['ИспПрДата'], what:x['ПредмИсп'], debt:num(x['СумДолг']), rest:num(x['ОстЗадолж'])}))},
      bk:{n:num(bk.data['ЗапВсего']),
          rows:((bk.data['Записи'])||[]).slice(0,10).map(x=>({date:x['Дата'], type:x['ТипНаим']||x['Тип'], caseNum:x['НомерДела'], court:x['Суд'], url:safeUrl(x['URL'])}))},
    };
    /* попутно — то, что сервис вернул о самом контрагенте */
    if(!S.cp && S.auto.who.name) S.cp = S.auto.who.name;
    if(!S.ogrn && S.auto.who.ogrn) S.ogrn = S.auto.who.ogrn;
    if(S.auto.who.reg){
      const yrs = (Date.now() - new Date(S.auto.who.reg).getTime()) / (365.25*864e5);
      if(isFinite(yrs)) S.age = yrs < 1 ? '<1' : (yrs < 3 ? '1-3' : '>3');
    }
    autoNotes();
    toast('Суды, приставы и банкротство проверены');
  }catch(e){
    autoErr = (e && e.message==='Failed to fetch') ? 'не удалось связаться с api.checko.ru — проверьте интернет и не блокирует ли запрос корпоративная сеть' : String((e && e.message) || e);
  }
  autoBusy = false; render();
}

/* результат раскладывается по позициям 9–11 чек-листа. Квалификацию при находках даёт
   комплаенс-менеджер; «соответствует» ставится само только там, где не найдено ничего. */
function autoNotes(){
  const a = S.auto; if(!a) return;
  const head = `${AUTO_MARK} ${stamp(a.at)}, ИНН ${a.inn}, источник — Checko`;
  const put = (n, text, clean)=>{
    const c = S.cl[n] || {};
    if(!(c.note||'').trim() || c.note.startsWith(AUTO_MARK)) c.note = text;
    if(!c.q && clean) c.q = 'ok';
    S.cl[n] = c;
  };
  const last = a.def.rows.slice(0,5).map(x=>`${x.num} от ${rus(x.date)}${x.sum?`, ${money(x.sum)} ₽`:''}${x.other?`, истец ${x.other}`:''}`).join('; ');
  put(9, `${head} (данные картотеки арбитражных дел). Ответчик: дел — ${a.def.n}, сумма требований — ${money(a.def.sum)} ₽; из них не завершено — ${a.act.n} на ${money(a.act.sum)} ₽. Истец: дел — ${a.pl.n} на ${money(a.pl.sum)} ₽.${last?` Последние дела, где контрагент ответчик: ${last}.`:''} Суды общей юрисдикции сервис не охватывает.`, a.def.n===0);
  const enfLast = a.enf.rows.slice(0,5).map(x=>`${x.num} от ${rus(x.date)}: ${x.what||'предмет не указан'}, остаток ${money(x.rest)} ₽`).join('; ');
  put(10, `${head} (данные банка исполнительных производств ФССП). Производств — ${a.enf.more?'более ':''}${a.enf.n}, сумма долга — ${money(a.enf.debt)} ₽, остаток задолженности — ${money(a.enf.rest)} ₽.${enfLast?` Последние: ${enfLast}.`:''}`, a.enf.n===0);
  const bkLast = a.bk.rows.slice(0,5).map(x=>`${rus(x.date)} — ${x.type||'сообщение'}${x.caseNum?`, дело ${x.caseNum}`:''}`).join('; ');
  put(11, `${head} (данные ЕФРСБ). Сообщений о банкротстве — ${a.bk.n}.${bkLast?` Последние: ${bkLast}.`:''}`, a.bk.n===0);
}

<p><b>Исполнительные производства.</b> ${a.enf.more?'Более ':''}${a.enf.n}, сумма долга ${money(a.enf.debt)} ₽, остаток ${money(a.enf.rest)} ₽.</p>

    ${a.enf.rows.length?`<h3 style="margin-top:12px">Исполнительные производства</h3><ul class="tight">${a.enf.rows.map(x=>`<li>${esc(x.num)} от ${rus(x.date)}: ${esc(x.what||'предмет не указан')}, остаток ${money(x.rest)} ₽</li>`).join('')}</ul>`:''}
    ${a.bk.rows.length?`<h3 style="margin-top:12px">Сообщения ЕФРСБ</h3><ul class="tight">${a.bk.rows.map(x=>`<li>${rus(x.date)} — ${link(x.url, x.type||'сообщение')}${x.caseNum?`, дело ${esc(x.caseNum)}`:''}</li>`).join('')}</ul>`:''}

/* ====================== шаг 3 — чек-лист ====================== */

        </span>
      </div>

      ${needNote?`<div class="need">Приложение № 5: оценочные понятия автоматически не применяются — укажите фактические показатели и обоснование.</div>`:''}

/* ====================== шаг 4 — стоп-факторы ====================== */
function renderS4(){
  const r = calc();
  const label = {flag:'красный флаг', over:'преодолимый стоп-фактор', abs:'абсолютный стоп-фактор'};
  const crit = CRIT.map(c=>{
    const cur = S.crit[c.n] || 'no';
    const cls = cur==='abs'||cur==='over' ? 'f-over' : cur==='flag' ? 'f-flag' : '';
    const opts = ['no'].concat(c.allow).map(v=>{
      const cl = v==='flag'?'w':(v==='over'||v==='abs')?'c':'';
      const txt = v==='no'?'не выявлено':label[v];
      return `<label class="${cl}"><input type="radio" name="cr${c.n}" data-cr="${c.n}" value="${v}" ${cur===v?'checked':''}><span>${txt}</span></label>`;
    }).join('');
    const needNote = cur!=='no' && !((S.crit[c.n+'_why']||'').trim());
    return `<div class="ci ${cls}">
      <div class="ci-hd"><span class="n">${c.n}</span><span class="what">${esc(c.t)}</span></div>

/* ====================== шаг 6 — заключение ====================== */
function concText(){
  const r = calc(), o = r.org;
  const L = [];
  const nl = ()=>L.push('');
  L.push('ЗАКЛЮЧЕНИЕ КОМПЛАЕНС-МЕНЕДЖЕРА ПО РЕЗУЛЬТАТАМ ПРОВЕРКИ КОНТРАГЕНТА');
  L.push('(Приложение № 7 к Регламенту о порядке проведения комплаенс-проверки контрагентов)');
  nl();
  L.push(`Номер и дата Заключения: ${S.num||'б/н'} от ${rus(S.date)}`);
  L.push(`Организация Группы: ${orgName()}${o.inn?`, ИНН ${o.inn}`:''}`);
  L.push(`Порог проверки и границы уровней: ${money(o.porog)} / ${money(o.base)} / ${money(o.std)} ₽${o.prikaz?` (приказ ${o.prikaz})`:''}`);
  L.push(`Контрагент: ${S.cp||'—'}, ИНН ${S.inn||'—'}${S.ogrn?`, ОГРН ${S.ogrn}`:''}`);
  L.push(`Предмет и сумма договора: ${r.subj.t}; ${money(r.own)} ₽ с НДС`);
  if(S.hasContracts==='yes' && r.contracts.length){
    L.push(`Действующие договоры с контрагентом (по сведениям инициатора), всего на ${money(r.contractsTotal)} ₽:`);
    r.contracts.forEach((c,i)=>L.push(`  ${i+1}) ${c.org||'организация не указана'} — ${c.what||'реквизиты не указаны'}; ${money(c.sum)} ₽${c.linked?'; взаимосвязан с новой сделкой':''}`));
    if(r.linked) L.push(`Сумма для определения порога и уровня (п. 4.4): ${money(r.sum)} ₽, включая взаимосвязанные договоры на ${money(r.linked)} ₽`);
  } else if(S.hasContracts==='no'){
    L.push('Действующие договоры с контрагентом: по сведениям инициатора отсутствуют');
  }
  L.push(`Условия оплаты: ${S.pay==='fact'?'оплата по факту':S.pay==='cp-prepay'?'предоплата со стороны контрагента':`аванс ${r.avans} %`}; источник финансирования — ${ {own:'собственные средства',project:'проектное финансирование',dolevoe:'средства участников долевого строительства'}[S.fin] }`);
  L.push(`Инициатор: ${S.initiator||'—'}`);
  L.push(`Основание проверки: ${ {new:'новый договор',prolong:'продление, дополнительное соглашение',extra:'внеочередная проверка'}[S.reason] }`);
  L.push(`Присвоенный уровень риска: ${LVL_NAME[r.lvl].toLowerCase()}${r.raised?` (повышен комплаенс-менеджером: ${S.lvlWhy||'обоснование не указано'})`:''}`);
  if(r.p53.length) L.push(`Основания углублённого уровня (п. 5.3): ${r.p53.join('; ')}`);
  nl();
  L.push('1. РЕЗУЛЬТАТЫ ПРОВЕРКИ (позиции чек-листа Приложения № 5)');
  L.push(`Проверенные позиции: ${r.scope.join(', ')}.`);
  r.scope.forEach(n=>{
    const c = S.cl[n]||{}; const it = CHECKLIST.find(x=>x.n===n);
    const q = {ok:'соответствует',flag:'красный флаг',over:'преодолимый стоп-фактор',abs:'абсолютный стоп-фактор'}[c.q] || 'не заполнено';
    L.push(`  ${n}. ${it.t} — ${q}.${(c.note||'').trim()?` ${c.note.trim()}`:''}`);
  });
  if(S.auto && !r.scope.includes(9)){
    const a = S.auto;
    L.push(`  Дополнительно, вне объёма уровня (автопроверка ${stamp(a.at)}, источник — Checko): арбитражные дела, ответчик — ${a.def.n} на ${money(a.def.sum)} ₽, не завершено — ${a.act.n}; исполнительные производства — ${a.enf.more?'более ':''}${a.enf.n}, остаток ${money(a.enf.rest)} ₽; сообщения ЕФРСБ — ${a.bk.n}.`);
  }
  nl();
  L.push('2. ПРОФИЛЬНЫЕ МНЕНИЯ ПОДРАЗДЕЛЕНИЙ');
  if(r.need.length) r.need.forEach(n=>L.push(`  ${n.d} — запрошено обязательно (${n.why}). Запрошено ____________, получено ____________. Существо позиции: ____________`));
  else L.push('  Обязательное привлечение не требуется.');
  nl();
  L.push('3. СТОП-ФАКТОРЫ И КРАСНЫЕ ФЛАГИ');
  if(!r.abs.length && !r.over.length && !r.flag.length) L.push('  Не выявлены.');
  r.abs.forEach(x=>L.push(`  Абсолютный стоп-фактор — ${x.t} (${x.src}). ${x.why}`));
  r.over.forEach(x=>L.push(`  Преодолимый стоп-фактор — ${x.t} (${x.src}). ${x.why}`));
  r.flag.forEach(x=>L.push(`  Красный флаг — ${x.t} (${x.src}). ${x.why}`));
  nl();
  L.push('4. ВЫВОД');
  L.push(`  ${r.verdictText}. ${r.verdictWhy||''}`);
  nl();
  L.push('5. ОБЯЗАТЕЛЬНЫЕ К ВКЛЮЧЕНИЮ В ДОГОВОР УСЛОВИЯ (МИТИГАЦИЯ)');
  const chosen = TERMS.map((t,i)=>({t,i})).filter(({i})=> S.terms[i] || (i===0 && r.lvl>=2));
  if(chosen.length) chosen.forEach(({t,i},k)=>L.push(`  ${k+1}. ${t}${(S.terms[i+'_v']||'').trim()?`: ${S.terms[i+'_v'].trim()}`:''}`));
  else L.push('  Не требуются.');
  if(r.mit.length){ nl(); L.push('  Рекомендуемые меры по п. 9.3:'); r.mit.forEach(m=>L.push(`  — ${m.t}`)); }
  nl();
  L.push(`6. СРОК ДЕЙСТВИЯ ЗАКЛЮЧЕНИЯ: до ${rus(r.validUntil)} (${r.valid} мес., п. 9.4)`);
  nl();
  L.push(`Комплаенс-менеджер: ${S.km||'____________________'}    Дата: ${rus(S.date)}    Подпись: ____________`);
  if(r.needP83){
    nl();
    L.push('РЕШЕНИЕ УПОЛНОМОЧЕННОГО ЛИЦА (п. 8.3)');
    L.push(S.decision || '____________________________________________________________________');
    if(r.needPartner) L.push('Требуется дополнительное согласование управляющего партнёра Группы.');
    L.push('Копия решения направляется управляющему партнёру Группы в течение 1 рабочего дня.');
  }
  if(r.abs.length){
    nl();
    L.push('Абсолютный стоп-фактор управленческим решением не преодолевается. Сделка возможна только после устранения обстоятельства либо подтверждения отсутствия установленного законом запрета.');
  }
  return L.join('\n');
}

/* ====================== Справка ====================== */
function renderHelp(){
  document.getElementById('v-help').innerHTML = `
  <div class="card" style="margin-top:18px">
    <div class="hd"><h2>Как это устроено</h2></div>
    <p>Приложение ведёт Стадию 0 договорной работы по Регламенту о порядке проведения комплаенс-проверки контрагентов ГК «С.АН ГРУПП»: считает уровень риска, показывает нужный объём чек-листа, квалифицирует стоп-факторы, подбирает меры митигации и собирает Заключение по форме Приложения № 7.</p>
    <h3>Кто что делает</h3>
    <ul class="tight">
      <li><b>Инициатор</b> заполняет шаг «Сделка»: сначала отмечает исключения, затем условия сделки и действующие договоры с контрагентом. Готовую сделку передаёт комплаенс-менеджеру ссылкой или файлом. Запрос документов контрагенту может отправить и он.</li>
      <li><b>Комплаенс-менеджер</b> открывает сделку, запускает автопроверку, проходит чек-лист, стоп-факторы, митигацию и оформляет Заключение. Он же ведёт пороги, перечень исключений и Реестр.</li>
      <li>Режим переключается в шапке. Ссылка для инициаторов с вкладки «Настройки» сразу открывает приложение в режиме инициатора с вашими порогами и исключениями.</li>
    </ul>
    <h3>Что считается автоматически</h3>
    <ul class="tight">
      <li>Нужна ли проверка вообще — исключения п. 4.7 (в том числе по перечню комплаенс-менеджера), порог организации (Приложение № 2), случаи п. 4.6.</li>
      <li>Сумма для сравнения с порогом: к сумме новой сделки прибавляются действующие договоры, которые инициатор отметил как взаимосвязанные (п. 4.4).</li>
      <li>Уровень риска — по пяти критериям Приложения № 1, берётся наибольший (п. 5.2), затем применяются основания п. 5.3.</li>
      <li>Объём чек-листа: базовый — позиции 1–7 и 19–21, стандартный — 1–14 и 19–24, углублённый — все 28.</li>
      <li>Сроки Стадии 0 (1 / 2 / 5 рабочих дней), срок действия Заключения (12 / 12 / 6 месяцев), перечень документов для запроса.</li>
      <li>Арбитражные дела, исполнительные производства и сообщения ЕФРСБ по ИНН контрагента — через API Checko, если на вкладке «Настройки» внесён ключ. Итог раскладывается по позициям 9–11 чек-листа.</li>
      <li>Обязательность привлечения профильных подразделений (п. 6.4) и налоговой оговорки (п. 12.5).</li>
      <li>Вывод по п. 7.9 и необходимость решения по п. 8.3, включая согласование управляющего партнёра.</li>
    </ul>
    <h3>Чего приложение не делает</h3>
    <ul class="tight">
      <li>Не ходит само в ЕГРЮЛ, «Прозрачный бизнес», ГИР БО и остальные реестры, кроме трёх перечисленных выше, — даёт ссылки, а результат вносит комплаенс-менеджер. Выгрузки и снимки экрана приобщаются к досье отдельно (п. 7.3).</li>
      <li>Не квалифицирует находки автопроверки. «Соответствует» ставится само только там, где не найдено ничего; дела, производства и сообщения оцениваете вы. Суды общей юрисдикции автопроверка не охватывает.</li>
      <li>Не заменяет мотивировку. Там, где Регламент требует фактических показателей и обоснования, поле обязательно к заполнению.</li>
      <li>Не хранит данные на сервере: пороги, перечень исключений, реестр и черновик лежат в localStorage этого браузера. Сделка от инициатора едет внутри ссылки или файлом. Наружу уходит одно — ИНН контрагента в Checko при автопроверке.</li>
      <li>Не содержит пороговых значений: они устанавливаются приказами руководителей организаций и вносятся на вкладке «Настройки».</li>
    </ul>
    <h3>Понижение уровня</h3>
    <p>Комплаенс-менеджер вправе мотивированно повысить уровень проверки по любой сделке. Понижение ниже уровня, определяемого Приложениями № 1 и № 2, не допускается (п. 5.4) — в приложении такой возможности нет.</p>
  </div>`;
}

/* ====================== перерисовка ====================== */
function render(){
  if(ROLE==='init'){ if(view==='registry' || view==='orgs') view='check'; if(step>INIT_STEPS) step=1; }
  document.querySelectorAll('#role button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.role===ROLE));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('hidden', ROLE==='init' && (t.dataset.view==='registry' || t.dataset.view==='orgs')));
  ['check','registry','orgs','help'].forEach(v=>{
    document.getElementById('v-'+v).classList.toggle('hidden', v!==view);
  });
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.view===view));
  if(view==='check'){
    renderSteps();
    [1,2,3,4,5,6].forEach(n=>document.getElementById('s'+n).classList.toggle('hidden', n!==step));
    if(step===1) renderS1();
    if(step===2) renderReq();
    if(step===3) renderS3();
    if(step===4) renderS4();
    if(step===5) renderS5();
    if(step===6) renderS6();
    renderSide();
  }
  if(view==='registry') renderRegistry();
  if(view==='orgs') renderOrgs();
  if(view==='help') renderHelp();
  save(LS.draft, S);
}

/* ====================== события ====================== */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.f !== undefined){
    const k = t.dataset.f;
    S[k] = (t.type==='checkbox') ? t.checked : t.value;
    if(k==='pay' && t.value!=='avans') S.avans = '';
    if(k==='lvlManual') S.lvlManual = Number(t.value)||0;
    if(['org','subj','pay','fin','age','hist','excl','lvlManual','reason','hasContracts'].includes(k)) render();
    else {
      renderSide(); renderSteps(); save(LS.draft,S);
      if(!t.closest('#s1-out')) renderS1Out();
      renderHandoff();
    }
    return;
  }
  if(t.dataset.ct !== undefined){
    const c = S.contracts[Number(t.dataset.ct)]; if(!c) return;
    c[t.dataset.k] = t.type==='checkbox' ? t.checked : t.value;
    save(LS.draft,S); renderSide(); renderS1Out(); renderCtTotal(); renderHandoff(); return;
  }
  if(t.dataset.rqe !== undefined || t.dataset.rqx !== undefined) fit(t);
  if(t.dataset.rqe !== undefined){ S.req.edit[t.dataset.rqe] = t.value; save(LS.draft,S); renderReqPreview(); return; }
  if(t.dataset.rqx !== undefined){ const x = S.req.extra[Number(t.dataset.rqx)]; if(x){ x.t = t.value; save(LS.draft,S); renderReqPreview(); } return; }
  if(t.dataset.rqf !== undefined){ S.req[t.dataset.rqf] = t.value; save(LS.draft,S); renderReqPreview(); return; }
  if(t.dataset.ex !== undefined){
    const x = EXCL[Number(t.dataset.ex)]; if(x){ x[t.dataset.k] = t.value; save(LS.excl,EXCL); }
    return;
  }
  if(t.dataset.api !== undefined){ try{ localStorage.setItem(LS.api, t.value.trim()); }catch(e){} return; }
  if(t.dataset.note !== undefined){
    const n = t.dataset.note;
    S.cl[n] = Object.assign({}, S.cl[n], {note:t.value});
    save(LS.draft,S); renderSide(); return;
  }
  if(t.dataset.crwhy !== undefined){ S.crit[t.dataset.crwhy+'_why'] = t.value; save(LS.draft,S); return; }
  if(t.dataset.termv !== undefined){ S.terms[t.dataset.termv+'_v'] = t.value; save(LS.draft,S); return; }
  if(t.dataset.org !== undefined){
    const o = ORGS.find(x=>x.id==t.dataset.org);
    if(o){ const k=t.dataset.k; o[k] = ['name','inn','role','prikaz'].includes(k) ? t.value : (Number(t.value)||0); save(LS.orgs,ORGS); }
    return;
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.cl !== undefined){
    S.cl[t.dataset.cl] = Object.assign({}, S.cl[t.dataset.cl], {q:t.value});
    render(); return;
  }
  if(t.dataset.cr !== undefined){ S.crit[t.dataset.cr] = t.value; render(); return; }
  if(t.dataset.flag !== undefined){
    const n = Number(t.dataset.flag);
    S.flags = S.flags || [];
    if(t.checked){ if(!S.flags.includes(n)) S.flags.push(n); }
    else S.flags = S.flags.filter(x=>x!==n);
    render(); return;
  }
  if(t.dataset.b !== undefined){ S[t.dataset.b] = t.checked; render(); return; }
  if(t.dataset.p46 !== undefined){
    const v = t.dataset.p46; S.p46 = S.p46 || [];
    if(t.checked){ if(!S.p46.includes(v)) S.p46.push(v); } else S.p46 = S.p46.filter(x=>x!==v);
    render(); return;
  }
  if(t.dataset.term !== undefined){ S.terms[t.dataset.term] = t.checked; render(); return; }
  if(t.dataset.rqs !== undefined){ S.req.sel[t.dataset.rqs] = t.checked; render(); return; }
});

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-step],[data-go],[data-act],[data-view],[data-open],[data-del],[data-mon],[data-copyinn],[data-orgdel],[data-role],[data-ctdel],[data-rqreset],[data-rqxdel],[data-exdel]');
  if(!t) return;

  if(t.dataset.role){ ROLE = t.dataset.role; try{ localStorage.setItem(LS.role, ROLE); }catch(err){} render(); return; }
  if(t.dataset.ctdel !== undefined){ S.contracts.splice(Number(t.dataset.ctdel),1); render(); return; }
  if(t.dataset.rqreset !== undefined){ delete S.req.edit[t.dataset.rqreset]; render(); return; }
  if(t.dataset.rqxdel !== undefined){ S.req.extra.splice(Number(t.dataset.rqxdel),1); render(); return; }
  if(t.dataset.exdel !== undefined){ EXCL.splice(Number(t.dataset.exdel),1); save(LS.excl,EXCL); render(); return; }

  if(t.dataset.view){ view = t.dataset.view; render(); return; }
  if(t.dataset.step){ step = Number(t.dataset.step); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.go){ step = Number(t.dataset.go); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.copyinn){ copy(S.inn||''); return; }

  if(t.dataset.open !== undefined){
    const rec = REG[Number(t.dataset.open)];
    if(rec && rec.snapshot){ S = hydrate(JSON.parse(JSON.stringify(rec.snapshot))); view='check'; step=1; render(); toast('Проверка загружена'); }
    return;
  }
  if(t.dataset.del !== undefined){
    REG.splice(Number(t.dataset.del),1); save(LS.reg,REG); render(); return;
  }
  if(t.dataset.orgdel !== undefined){
    ORGS = ORGS.filter(o=>o.id != t.dataset.orgdel);
    if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
    save(LS.orgs,ORGS); render(); return;
  }
  if(t.dataset.mon !== undefined){
    REG[Number(t.dataset.mon)].monitor = today(); save(LS.reg,REG); render(); toast('Мониторинг отмечен'); return;
  }

  const a = t.dataset.act;
  const r = calc();

  if(a==='new'){ S = blank(); autoErr=''; step=1; render(); toast(ROLE==='init'?'Новая сделка':'Новая проверка'); return; }
  if(a==='copy-skip'){ copy(skipSheetText()); return; }
  if(a==='ct-add'){ S.contracts.push({org:'', what:'', sum:'', linked:false}); render(); return; }
  if(a==='deal-link' || a==='deal-file'){
    S.fromInit = {who:S.initiator, at:today()};
    if(!org().id) S.orgText = S.orgText || ''; else S.orgText = org().name;
    const d = JSON.parse(JSON.stringify(S));
    save(LS.draft,S);
    if(a==='deal-link') copy(baseUrl()+'#deal='+pack(d));
    else download(`Сделка_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${today()}.json`, JSON.stringify(d,null,2), 'application/json');
    return;
  }
  if(a==='deal-load'){
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0]; if(!f) return;
      f.text().then(txt=>{ try{ takeDeal(JSON.parse(txt.replace(/^\uFEFF/,''))); }catch(err){ toast('Не удалось разобрать файл сделки'); } });
    };
    inp.click(); return;
  }
  if(a==='init-link'){ copy(baseUrl()+'#init='+pack({orgs:ORGS, excl:EXCL})); return; }
  if(a==='ex-add'){ EXCL.push({inn:'', name:'', kind:'mono'}); save(LS.excl,EXCL); render(); return; }
  if(a==='api-clear'){ try{ localStorage.removeItem(LS.api); }catch(err){} render(); toast('Ключ удалён'); return; }
  if(a==='auto-run'){ autoCheck(); return; }
  if(a==='auto-doc'){ download(`Автопроверка_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${today()}.doc`, autoReportHtml(), 'application/msword'); return; }
  if(a==='rq-add'){ S.req.extra.push({t:''}); render(); const ta = document.querySelector(`[data-rqx="${S.req.extra.length-1}"]`); if(ta) ta.focus(); return; }
  if(a==='rq-reset'){ S.req.sel = {}; S.req.edit = {}; S.req.extra = []; render(); return; }
  if(a==='rq-copy'){ copy(reqText()); return; }
  if(a==='rq-doc'){ download(`Запрос-документов_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${today()}.doc`, reqDocHtml(), 'application/msword'); return; }
  if(a==='rq-mail'){ copy(reqText()); location.href = 'mailto:?subject=' + encodeURIComponent('Запрос документов для заключения договора'); return; }
  if(a==='all-ok'){ r.scope.forEach(n=>{ S.cl[n]=Object.assign({},S.cl[n],{q:'ok'}); }); render(); return; }
  if(a==='clear-cl'){ S.cl = {}; render(); return; }
  if(a==='print'){ window.print(); return; }
  if(a==='copy-concl'){ copy(concText()); return; }
  if(a==='doc-concl'){
    const html = `<html><head><meta charset="utf-8"></head><body style="font-family:Times New Roman,serif;font-size:12pt"><pre style="white-space:pre-wrap;font-family:Times New Roman,serif">${esc(concText())}</pre></body></html>`;
    download(`Заключение_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${S.date}.doc`, html, 'application/msword');
    return;
  }
  if(a==='save-reg'){
    if(!S.cp){ toast('Не указан контрагент'); return; }
    const rec = {
      cp:S.cp, inn:S.inn, orgName:orgName(), subject:r.subj.t, sum:r.own,
      contracts: r.contracts.map(c=>`${c.org||'—'}: ${c.what||'—'}, ${money(c.sum)} ₽`).join(' | '),
      lvl:r.lvl, num:S.num, date:S.date, verdict:r.verdictText,
      mitig: TERMS.map((tt,i)=> (S.terms[i]||(i===0&&r.lvl>=2)) ? tt : null).filter(Boolean).join('; '),
      decision: r.needP83 ? (S.decision||'требуется') : '',
      validUntil: r.validUntil, monitor:'', snapshot: JSON.parse(JSON.stringify(S)),
    };
    const ix = REG.findIndex(x=>x.inn===rec.inn && x.num===rec.num && rec.num);
    if(ix>=0) REG[ix] = rec; else REG.unshift(rec);
    save(LS.reg,REG); toast('Внесено в Реестр контрагентов'); return;
  }
  if(a==='csv' || a==='copy-csv'){
    const head = ['№','Контрагент','ИНН','Организация Группы','Предмет','Сумма','Уровень риска','№ Заключения','Дата','Вывод','Меры митигации','Решение по п. 8.3','Действует до','Дата мониторинга','Действующие договоры'];
    const q = s => `"${String(s==null?'':s).replace(/"/g,'""')}"`;
    const csv = [head.map(q).join(';')].concat(REG.map((x,i)=>[i+1,x.cp,x.inn,x.orgName,x.subject,x.sum,LVL_NAME[x.lvl],x.num,rus(x.date),x.verdict,x.mitig,x.decision,rus(x.validUntil),x.monitor?rus(x.monitor):'',x.contracts||''].map(q).join(';'))).join('\r\n');
    if(a==='csv') download('Реестр-комплаенс-проверок.csv', csv, 'text/csv;charset=utf-8');
    else copy(csv);
    return;
  }
  if(a==='export-reg'){ copy(JSON.stringify(REG,null,2)); download('reestr-komplaens.json', JSON.stringify(REG,null,2), 'application/json'); return; }
  if(a==='export-draft'){ copy(JSON.stringify(S,null,2)); download('proverka-'+(S.inn||'draft')+'.json', JSON.stringify(S,null,2), 'application/json'); return; }
  if(a==='import-reg'){
    const txt = prompt('Вставьте JSON реестра:');
    if(!txt) return;
    try{ const d = JSON.parse(txt); if(Array.isArray(d)){ REG = d; save(LS.reg,REG); render(); toast('Реестр загружен'); } else toast('Ожидался массив записей'); }
    catch(err){ toast('Не удалось разобрать JSON'); }
    return;
  }
  if(a==='org-add'){
    const id = ORGS.reduce((m,o)=>Math.max(m,o.id),0) + 1;
    ORGS.push({id, name:'', inn:'', role:'', porog:0, base:0, std:0, prikaz:''});
    if(!ORGS.find(o=>o.id==S.org)) S.org = id;
    save(LS.orgs,ORGS); render(); return;
  }
  if(a==='org-export'){
    const j = JSON.stringify({orgs:ORGS, excl:EXCL},null,2);
    copy(j); download('porogi-organizaciy.json', j, 'application/json'); return;
  }
  if(a==='org-import'){
    const txt = prompt('Вставьте JSON справочника организаций:');
    if(!txt) return;
    try{
      const raw = JSON.parse(txt);
      const d = Array.isArray(raw) ? raw : (raw && raw.orgs);
      if(!Array.isArray(d)){ toast('Ожидался справочник организаций'); return; }
      if(raw && Array.isArray(raw.excl)){ EXCL = cleanExcl(raw.excl); save(LS.excl,EXCL); }
      ORGS = d.map((o,i)=>({
        id: Number(o.id)||i+1, name:String(o.name||''), inn:String(o.inn||''), role:String(o.role||''),
        porog:Number(o.porog)||0, base:Number(o.base)||0, std:Number(o.std)||0, prikaz:String(o.prikaz||''),
      }));
      if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
      save(LS.orgs,ORGS); render(); toast(`Загружено организаций: ${ORGS.length}`);
    }catch(err){ toast('Не удалось разобрать JSON'); }
    return;
  }
});

/* ====================== приём сделки и настроек по ссылке ====================== */
function cleanOrgs(d){
  return d.map((o,i)=>({ id:Number(o.id)||i+1, name:String(o.name||''), inn:String(o.inn||''), role:String(o.role||''),
    porog:Number(o.porog)||0, base:Number(o.base)||0, std:Number(o.std)||0, prikaz:String(o.prikaz||'') }));
}
function cleanExcl(d){
  return d.map(x=>({ inn:String(x.inn||''), name:String(x.name||''), kind:EXCL_NAME[x.kind]?x.kind:'mono' }));
}
function takeDeal(d){
  if(!d || typeof d!=='object' || Array.isArray(d)){ toast('Это не файл сделки'); return; }
  if((S.cp||S.inn) && !confirm('Открыть полученную сделку? Текущий черновик будет заменён.')) return;
  S = hydrate(d);
  /* у комплаенс-менеджера свой справочник: организация ищется по названию, а не по номеру */
  const byName = ORGS.find(o=>o.name && o.name===S.orgText);
  if(byName) S.org = byName.id; else if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
  if(!S.date) S.date = today();
  ROLE = 'km'; try{ localStorage.setItem(LS.role, ROLE); }catch(e){}
  view='check'; step=1; autoErr=''; render(); toast('Сделка от инициатора загружена');
}
function readHash(){
  const h = location.hash || '';
  const m = h.match(/^#(init|deal)=(.+)$/);
  if(!m) return;
  let d; try{ d = unpack(m[2]); }catch(e){ toast('Ссылка повреждена — попросите прислать её заново'); return; }
  history.replaceState(null, '', baseUrl());
  if(m[1]==='deal'){ takeDeal(d); return; }
  if(!d || !Array.isArray(d.orgs)) return;
  if(ROLE==='km' && ORGS.length && !confirm('Ссылка для инициаторов заменит справочник организаций и перечень исключений в этом браузере. Продолжить?')) return;
  ORGS = cleanOrgs(d.orgs); EXCL = cleanExcl(Array.isArray(d.excl)?d.excl:[]);
  save(LS.orgs,ORGS); save(LS.excl,EXCL);
  ROLE = 'init'; try{ localStorage.setItem(LS.role, ROLE); }catch(e){}
  if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
  view='check'; step=1;
}
window.addEventListener('hashchange', ()=>{ readHash(); render(); });
readHash();

/* тема */
document.getElementById('theme').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : cur==='light' ? '' : 'dark';
  if(next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem(LS.theme, next); }catch(e){}
});
try{ const th = localStorage.getItem(LS.theme); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}

render();
</script>
