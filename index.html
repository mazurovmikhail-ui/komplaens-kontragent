<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Комплаенс-проверка контрагента — рабочее место</title>
<style>
  :root{
    --paper:#eef0f4; --surface:#ffffff; --surface-2:#f6f7fa;
    --ink:#1a1d26; --muted:#5b6270; --faint:#8b91a0;
    --line:#d7dbe3; --line-strong:#c2c7d2;
    --accent:#234b8a; --accent-ink:#1c3d70; --accent-soft:#e7eef8;
    --good:#1c7a4d; --good-soft:#e2f2ea;
    --warn:#8a5a10; --warn-soft:#f6ecd8;
    --crit:#9e2a20; --crit-soft:#f7e4e2;
    --serif:Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",monospace;
    --sh:0 1px 2px rgba(20,25,40,.05),0 6px 20px rgba(20,25,40,.05);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0f1218; --surface:#171b23; --surface-2:#1d222c;
      --ink:#e7eaf1; --muted:#9aa2b3; --faint:#6b7384;
      --line:#2a2f3b; --line-strong:#3a414f;
      --accent:#7ea6e8; --accent-ink:#9cbcf0; --accent-soft:#1a2740;
      --good:#57c48b; --good-soft:#132a20;
      --warn:#d3a24e; --warn-soft:#2c2412;
      --crit:#e6796d; --crit-soft:#2e1715;
      --sh:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1218; --surface:#171b23; --surface-2:#1d222c;
    --ink:#e7eaf1; --muted:#9aa2b3; --faint:#6b7384;
    --line:#2a2f3b; --line-strong:#3a414f;
    --accent:#7ea6e8; --accent-ink:#9cbcf0; --accent-soft:#1a2740;
    --good:#57c48b; --good-soft:#132a20;
    --warn:#d3a24e; --warn-soft:#2c2412;
    --crit:#e6796d; --crit-soft:#2e1715;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--accent)}
  h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.25; margin:0}
  h1{font-size:21px}
  h2{font-size:18px; margin-bottom:10px}
  h3{font-size:15px; font-family:var(--sans); font-weight:650; margin-bottom:6px}
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px 80px}

  /* ---- шапка ---- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:var(--surface); border-bottom:1px solid var(--line);
    box-shadow:var(--sh);
  }
  .top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
  .brand small{color:var(--faint);font-size:11.5px;letter-spacing:.02em}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
    padding:6px 13px; border-radius:999px; cursor:pointer; font-size:13.5px; font-family:inherit;
  }
  .tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  .icon-btn{
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
    width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1
  }

  /* ---- сетка ---- */
  .cols{display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:18px; align-items:start; margin-top:18px}
  @media (max-width:960px){ .cols{grid-template-columns:minmax(0,1fr)} .side{position:static !important} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--sh); padding:16px 18px; margin-bottom:14px}
  .card > .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .card > .hd .ref{color:var(--faint);font-size:12px}
  .side{position:sticky; top:64px}

  /* ---- формы ---- */
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
  input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{
    font:inherit; font-size:14px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%;
  }
  textarea{min-height:64px;resize:vertical;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink);padding:5px 0;cursor:pointer}
  .chk input{margin-top:3px;flex:0 0 auto;accent-color:var(--accent)}
  .hint{color:var(--faint);font-size:12px;margin-top:4px}
  .btn{
    font:inherit;font-size:13.5px;border-radius:9px;padding:8px 14px;cursor:pointer;
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--crit);border-color:var(--crit)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* ---- бейджи ---- */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-base{background:var(--good-soft);color:var(--good)}
  .b-std{background:var(--warn-soft);color:var(--warn)}
  .b-deep{background:var(--crit-soft);color:var(--crit)}
  .b-off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .b-acc{background:var(--accent-soft);color:var(--accent-ink)}

  /* ---- сводка ---- */
  .sum-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .sum-line:last-child{border-bottom:0}
  .sum-line span:first-child{color:var(--muted)}
  .sum-line span:last-child{text-align:right;font-weight:600}
  .verdict{border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
  .v-ok{background:var(--good-soft);color:var(--good)}
  .v-cond{background:var(--warn-soft);color:var(--warn)}
  .v-neg{background:var(--crit-soft);color:var(--crit)}
  .v-off{background:var(--surface-2);color:var(--muted)}
  .verdict b{display:block;font-size:14.5px;margin-bottom:3px}

  /* ---- шаги ---- */
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .step{
    border:1px solid var(--line);background:var(--surface);border-radius:9px;
    padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted);display:flex;gap:7px;align-items:center;font-family:inherit
  }
  .step[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .step .num{
    display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;
    background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:700
  }
  .step[aria-current="true"] .num{background:var(--accent);color:#fff;border-color:var(--accent)}
  .step.done .num{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}

  /* ---- чек-лист ---- */
  .ci{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:var(--surface-2)}
  .ci.f-flag{border-color:var(--warn);background:var(--warn-soft)}
  .ci.f-over{border-color:var(--crit);background:var(--crit-soft)}
  .ci.f-abs{border-color:var(--crit);background:var(--crit-soft);box-shadow:inset 3px 0 0 var(--crit)}
  .ci .ci-hd{display:flex;gap:9px;align-items:baseline}
  .ci .n{font-family:var(--mono);font-size:12px;color:var(--faint);flex:0 0 26px}
  .ci .what{font-size:13.5px;flex:1}
  .ci .src{font-size:11.5px;color:var(--faint);margin:5px 0 8px 35px}
  .ci .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-left:35px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
  .seg label{padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
  .seg label:last-child{border-right:0}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg input:checked + span{font-weight:700}
  .seg label:has(input:checked){background:var(--accent-soft);color:var(--accent-ink)}
  .seg label.w:has(input:checked){background:var(--warn-soft);color:var(--warn)}
  .seg label.c:has(input:checked){background:var(--crit-soft);color:var(--crit)}
  .ci textarea{margin:8px 0 0 35px;width:calc(100% - 35px);min-height:44px;font-size:13px;background:var(--surface)}
  .need{color:var(--crit);font-size:11.5px;margin:4px 0 0 35px}

  /* ---- таблицы ---- */
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  table.t th{background:var(--surface-2);font-weight:650;font-size:12.5px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  tr.exp{background:var(--crit-soft)}

  ul.tight{margin:6px 0 0;padding-left:20px}
  ul.tight li{margin-bottom:4px;font-size:13.5px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .pill{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-family:var(--mono)}
  .hidden{display:none !important}
  .doc{font-family:var(--serif);font-size:14px;line-height:1.5}
  .doc h4{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:13.5px;
    z-index:99;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .18s
  }
  .toast.on{opacity:1}

  /* ---- роль ---- */
  .role{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface-2)}
  .role button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .role button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  /* ---- строки запроса и договоров ---- */
  .rq{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
  .rq:last-of-type{border-bottom:0}
  .rq > input[type=checkbox]{margin-top:9px;flex:0 0 auto;accent-color:var(--accent)}
  .rq .body{flex:1;min-width:0}
  .rq textarea{min-height:36px;font-size:13.5px;resize:none;overflow:hidden}
  .rq.off textarea{opacity:.5}
  .opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer;background:var(--surface-2);font-size:13.5px}
  .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .opt input{margin-top:3px;accent-color:var(--accent)}
  .letter{font-family:var(--serif);font-size:14px;line-height:1.55;white-space:pre-wrap;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--surface-2)}

  @media print{
    header.top,.steps,.side,.btnrow,.noprint{display:none !important}
    body{background:#fff;color:#000}
    .card{border:0;box-shadow:none;padding:0;margin:0}
    .wrap{max-width:none;padding:0}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Комплаенс-проверка контрагента</h1>
      <small>Стадия 0 договорной работы · ГК «С.АН ГРУПП»</small>
    </div>
    <div class="role" id="role" title="Кто работает с приложением">
      <button data-role="init" aria-pressed="false">Инициатор</button>
      <button data-role="km" aria-pressed="true">Комплаенс-менеджер</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="check" aria-selected="true">Проверка</button>
      <button class="tab" role="tab" data-view="registry" aria-selected="false">Реестр</button>
      <button class="tab" role="tab" data-view="orgs" aria-selected="false">Настройки</button>
      <button class="tab" role="tab" data-view="help" aria-selected="false">Справка</button>
    </div>
    <button class="icon-btn" id="theme" title="Тема">◐</button>
  </div>
</header>

<div class="wrap">

<!-- ============ ПРОВЕРКА ============ -->
<div id="v-check">
  <div class="steps" id="steps"></div>
  <div class="cols">
    <div>
      <section id="s1" class="stepbody"></section>
      <section id="s2" class="stepbody hidden"></section>
      <section id="s3" class="stepbody hidden"></section>
      <section id="s4" class="stepbody hidden"></section>
      <section id="s5" class="stepbody hidden"></section>
      <section id="s6" class="stepbody hidden"></section>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>

<!-- ============ РЕЕСТР ============ -->
<div id="v-registry" class="hidden"></div>

<!-- ============ ПОРОГИ ============ -->
<div id="v-orgs" class="hidden"></div>

<!-- ============ СПРАВКА ============ -->
<div id="v-help" class="hidden"></div>

</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ======================================================================
   Данные Регламента о порядке проведения комплаенс-проверки контрагентов
   (проверки должной осмотрительности) в ГК «С.АН ГРУПП».
   Все ссылки на пункты и приложения — на этот Регламент.
   ====================================================================== */

const LS = {orgs:'kpk.orgs.v1', reg:'kpk.registry.v1', draft:'kpk.draft.v1', theme:'kpk.theme',
            excl:'kpk.excl.v1', role:'kpk.role'};

/* Приложение № 2 — пороговые значения. В коде не хранятся:
   вносятся на вкладке «Пороги» и остаются в браузере пользователя. */
const ORGS_DEFAULT = [];

/* Предмет договора. lvl — минимальный уровень по Приложению № 1;
   sk — строительный блок (п. 4.6: проверка независимо от суммы, уровень не ниже стандартного). */
const SUBJECTS = [
  {v:'postavka-raz', t:'Разовая поставка ТМЦ',                                   lvl:1, sk:false},
  {v:'uslugi-prost', t:'Простые услуги',                                          lvl:1, sk:false},
  {v:'postavka-reg', t:'Регулярные закупки, поставка материалов',                 lvl:2, sk:false},
  {v:'oborud',       t:'Поставка оборудования',                                   lvl:2, sk:false, teh:true},
  {v:'arenda',       t:'Аренда',                                                  lvl:2, sk:false},
  {v:'uslugi',       t:'Возмездное оказание услуг, агентские, консультационные',  lvl:2, sk:false},
  {v:'samozan',      t:'Договор с самозанятым или ИП',                            lvl:2, sk:false},
  {v:'podryad',      t:'Генподряд, подряд, субподряд, СМР',                       lvl:2, sk:true,  teh:true},
  {v:'proekt',       t:'Проектные и изыскательские работы',                       lvl:2, sk:true,  teh:true},
  {v:'tehzak',       t:'Функции технического заказчика',                          lvl:2, sk:true,  teh:true},
  {v:'nedvizh', noPorog:true,      t:'Купля-продажа недвижимости или земельного участка',       lvl:3, sk:false},
  {v:'zaim', noPorog:true,         t:'Заём, кредит, залог, поручительство, уступка требования', lvl:3, sk:false},
  {v:'sovm', noPorog:true,         t:'Совместная деятельность, инвестиционный договор',         lvl:3, sk:false},
];

/* Приложение № 5 — чек-лист комплаенс-проверки */
const CHECKLIST = [
  {n:1,  p:1, t:'Государственная регистрация, статус, дата создания, ОКВЭД, размер уставного капитала', s:'ЕГРЮЛ / ЕГРИП', u:'https://egrul.nalog.ru/'},
  {n:2,  p:1, t:'Записи о недостоверности сведений (адрес, руководитель, участники)', s:'ЕГРЮЛ', u:'https://egrul.nalog.ru/'},
  {n:3,  p:1, t:'Решение о предстоящем исключении из ЕГРЮЛ, о ликвидации, о реорганизации', s:'ЕГРЮЛ', u:'https://egrul.nalog.ru/'},
  {n:4,  p:1, t:'Полномочия подписанта: устав, решение об избрании, доверенность, срок полномочий', s:'Документы контрагента', u:''},
  {n:5,  p:1, t:'Необходимость корпоративного одобрения (крупная сделка, сделка с заинтересованностью) и его наличие', s:'Устав, отчётность контрагента', u:''},
  {n:6,  p:1, t:'Дисквалификация руководителя; «массовые» руководители и учредители; адрес массовой регистрации', s:'«Прозрачный бизнес», реестр дисквалифицированных лиц', u:'https://pb.nalog.ru/'},
  {n:7,  p:1, t:'Включение контрагента, его руководителя и участников в перечни Росфинмониторинга (экстремизм, терроризм, ФРОМУ)', s:'fedsfm.ru', u:'https://www.fedsfm.ru/'},
  {n:8,  p:1, t:'Включение в санкционные перечни (при иностранном элементе и трансграничных расчётах)', s:'Открытые санкционные перечни, сведения банка', u:''},
  {n:9,  p:1, t:'Судебные споры: количество, суммы, роль (истец / ответчик), споры по качеству и срокам', s:'kad.arbitr.ru, sudrf.ru', u:'https://kad.arbitr.ru/'},
  {n:10, p:1, t:'Исполнительные производства: количество, суммы, предмет взыскания', s:'Банк данных исполнительных производств ФССП', u:'https://fssp.gov.ru/iss/ip'},
  {n:11, p:1, t:'Дела о банкротстве, намерения кредиторов обратиться в суд', s:'ЕФРСБ', u:'https://bankrot.fedresurs.ru/'},
  {n:12, p:1, t:'Существенные факты: залог долей, лизинг, изменение состава участников, уведомления кредиторов', s:'Федресурс', u:'https://fedresurs.ru/'},
  {n:13, p:1, t:'Включение в реестр недобросовестных поставщиков', s:'ЕИС закупок', u:'https://zakupki.gov.ru/epz/dishonestsupplier/search/results.html'},
  {n:14, p:1, t:'Обременения движимого имущества, передаваемого по договору', s:'Реестр уведомлений о залоге движимого имущества', u:'https://www.reestr-zalogov.ru/'},
  {n:15, p:1, t:'Права на недвижимое имущество и обременения (для сделок с недвижимостью и аренды)', s:'Выписка из ЕГРН', u:'https://rosreestr.gov.ru/'},
  {n:16, p:1, t:'Лицензии, членство в СРО, допуски, наличие записей в НРС', s:'Реестры СРО, НОСТРОЙ / НОПРИЗ, реестры лицензий', u:'https://nostroy.ru/'},

  mono:'Ресурсоснабжающие организации, естественные монополии, операторы связи, кредитные организации',
  intragroup:'Организация Группы — внутригрупповая сделка',
};
/* JSON <-> base64url для ссылок «инициатору» и «комплаенс-менеджеру». Данные едут во фрагменте
   адреса (#…), который браузер на сервер не отправляет. */
function pack(obj){
  const b = new TextEncoder().encode(JSON.stringify(obj)); let bin=''; b.forEach(c=>bin+=String.fromCharCode(c));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unpack(str){
  const bin = atob(str.replace(/-/g,'+').replace(/_/g,'/')); const b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(b));
}
function baseUrl(){ return location.href.split('#')[0]; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1900); }
/* рабочие дни: суббота и воскресенье пропускаются; праздничные дни и переносы не учитываются */
function addWorkdays(iso, n){
  const d = new Date(iso + 'T12:00:00'); let left = n;
  while(left > 0){ d.setDate(d.getDate()+1); const w = d.getDay(); if(w !== 0 && w !== 6) left--; }
  return d.toISOString().slice(0,10);
}
function nextNum(){
  const y = (S.date||today()).slice(0,4);
  const nums = REG.map(x=>String(x.num||'')).filter(Boolean);
  const last = nums.find(x=>/\d+\s*$/.test(x));
  if(last){ const m = last.match(/^(.*?)(\d+)\s*$/); const same = m[1].includes(y) || !/20\d\d/.test(m[1]);
    if(same) return m[1] + String(Number(m[2])+1).padStart(m[2].length,'0'); }
  return `КМ-${y}/001`;
}
function regAlerts(){
  const t = today(), soon = addMonths(t, 1);
  const expired = REG.filter(x=>x.validUntil && x.validUntil < t);
  const expiring = REG.filter(x=>x.validUntil && x.validUntil >= t && x.validUntil <= soon);
  const monitor = REG.filter(x=>x.lvl===3 && !(x.validUntil && x.validUntil < t) && addMonths(x.monitor || x.date || t, 3) <= t);
  return {expired, expiring, monitor, total:expired.length + expiring.length + monitor.length};
}
function addMonths(iso,m){ const d=new Date(iso); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Скопировано в буфер обмена'), ()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Скопировано в буфер обмена'); }catch(e){ toast('Скопировать не удалось'); }
  document.body.removeChild(ta);
}
function download(name, text, mime){
  try{
    const b=new Blob(['﻿'+text],{type:mime||'text/plain;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
  }catch(e){ toast('Скачивание недоступно — используйте копирование'); }
}

/* ====================== расчёт по Регламенту ====================== */
function calc(){
  const o = org(), sj = subj();
  const own = Number(S.sum)||0;
  /* п. 4.4 — сумма считается по совокупности взаимосвязанных сделок; действующие договоры,
     отмеченные как взаимосвязанные, прибавляются к сумме новой сделки */
  const contracts = S.hasContracts==='yes' ? (S.contracts||[]) : [];
  const linked = contracts.filter(c=>c.linked).reduce((a,c)=>a+(Number(c.sum)||0),0);
  const sum = own + linked;
  const avans = Number(S.avans)||0;
  const r = {org:o, subj:sj, sum, own, linked, contracts, avans};
  r.contractsTotal = contracts.reduce((a,c)=>a+(Number(c.sum)||0),0);

  /* --- нужна ли проверка (пп. 4.5–4.7) --- */
  r.p46 = [];
  if(sj.sk) r.p46.push('Подрядные, строительно-монтажные, проектные и изыскательские работы, функции техзаказчика — проверка независимо от суммы (п. 4.6)');
  (S.p46||[]).forEach(k=>r.p46.push(k));

  r.exclListed = (!S.excl && S.excl!=='none') ? exclMatch() : null;
  r.excl = (S.excl && S.excl!=='none') ? S.excl : (r.exclListed ? r.exclListed.kind : '');
  r.skip = false; r.skipWhy = ''; r.exclSkip = false;
  if(r.excl && r.p46.length) r.condSkip = 'Исключение выбрано, но к сделке оно не применяется: есть основание проверки независимо от суммы (п. 4.6). Проверка проводится.';
  if(r.excl && !r.p46.length){
    r.skip = true; r.exclSkip = true;
    r.skipWhy = r.excl === 'intragroup'
      ? 'Внутригрупповая сделка (пп. 4 п. 4.7). Проверка не проводится; комплаенс-менеджер с привлечением финансового департамента подтверждает соответствие цены принципу «вытянутой руки» и оформляет Заключение в сокращённой форме.'
      : 'Сделка отнесена к исключениям п. 4.7. Основание фиксируется инициатором в листе согласования со ссылкой на подпункт п. 4.7 и приказ организации об установлении порогов.';
  } else if(!r.p46.length && sum <= o.porog){
    const payOk = (S.pay === 'fact' || S.pay === 'cp-prepay') && !sj.noPorog;
    if(sj.noPorog){
      r.condSkip = 'Сумма не превышает порог, но исключение пп. 1 п. 4.7 к такой сделке неприменимо: оно обусловлено оплатой по факту поставки (выполнения) либо предоплатой со стороны контрагента, а по займу, залогу, поручительству, уступке, сделке с недвижимостью и совместной деятельности такое условие не устанавливается. Проверка проводится.';
    }
    if(payOk){
      r.skip = true;
      r.skipWhy = `Сумма ${money(sum)} ₽ не превышает порог проверки ${money(o.porog)} ₽ для ${o.name}, оплата — ${S.pay==='fact'?'по факту':'предоплата со стороны контрагента'} (пп. 1 п. 4.7).`;
    } else {
      r.condSkip = `Сумма не превышает порог, но условие пп. 1 п. 4.7 не выполнено: предусмотрен аванс со стороны организации Группы. Проверка проводится.`;
    }
  }

  /* --- уровень риска (Приложение № 1, пп. 5.2–5.3) --- */
  const parts = [];
  let bySum = 1;
  if(sum > o.std) bySum = 3; else if(sum > o.base) bySum = 2; else bySum = 1;
  parts.push({k:'Сумма сделки', v:bySum, note:`${money(sum)} ₽${linked?` (${money(own)} + ${money(linked)} по взаимосвязанным действующим договорам)`:''} при границах ${money(o.base)} / ${money(o.std)} ₽`});
  parts.push({k:'Предмет договора', v:sj.lvl, note:sj.t});
  const byHist = S.hist==='>2' ? 1 : (S.hist==='0.5-2' ? 2 : 3);
  parts.push({k:'История сотрудничества', v:byHist, note:{'>2':'Более 2 лет без замечаний','0.5-2':'От 6 месяцев до 2 лет','new':'Новый контрагент либо замечания по исполнению'}[S.hist]});
  const byAge = S.age==='>3' ? 1 : (S.age==='1-3' ? 2 : 3);
  parts.push({k:'Срок деятельности', v:byAge, note:{'>3':'Более 3 лет','1-3':'От 1 года до 3 лет','<1':'Менее 1 года'}[S.age]});
  let byPay = 1;
  if(S.fin==='project') byPay = 3; else if(avans > 30) byPay = 3; else if(avans > 0) byPay = 2;
  parts.push({k:'Расчёты', v:byPay, note:(S.fin==='project'?'Проектное финансирование; ':'') + (avans>0?`аванс ${avans} %`:'оплата по факту / постоплата')});

  let lvl = Math.max(...parts.map(p=>p.v));
  const forced = [];
  if(sj.sk && lvl < 2){ lvl = 2; forced.push('Подрядные, СМР, проектные и изыскательские работы, техзаказчик — уровень не ниже стандартного (п. 4.6)'); }

  /* п. 5.3 — углублённый независимо от суммы */
  const p53 = [];
  if(sj.sk && sum > o.base) p53.push(`СМР, проектирование, изыскания или функции техзаказчика при сумме свыше верхней границы базового уровня (${money(o.base)} ₽)`);
  if(S.fin==='project') p53.push('Оплата за счёт средств целевого банковского кредита (проектного финансирования)');
  if(avans > 30) p53.push('Авансирование свыше 30 % цены договора');
  if(S.age==='<1') p53.push('Контрагент зарегистрирован менее 12 месяцев назад');
  if(S.noexp) p53.push('Отсутствие подтверждённого опыта по предмету договора');
  if(S.affil) p53.push('Взаимозависимость или аффилированность с организацией Группы, её участниками или руководителями');
  if(S.foreign) p53.push('Сделка с иностранным элементом либо трансграничные платежи');
  const nFlags = (S.flags||[]).length;
  if(nFlags >= 2) p53.push(`Выявлено ${nFlags} красных флага (два и более)`);
  if(p53.length){ lvl = 3; }
  r.p53 = p53;
  r.forced = forced;
  r.parts = parts;

  r.lvlAuto = lvl;
  r.lvl = Math.max(lvl, Number(S.lvlManual)||0);
  r.raised = r.lvl > r.lvlAuto;

  /* --- объём и сроки --- */
  r.scope   = SCOPE[r.lvl];
  r.days    = LVL_DAYS[r.lvl];
  r.opinion = LVL_OPIN[r.lvl];
  r.valid   = LVL_VALID[r.lvl];
  r.anketa  = r.lvl === 1 ? 'Форма А (краткая)' : 'Форма Б (расширенная)';
  r.blocks  = r.lvl === 1 ? ['A'] : (r.lvl === 2 ? ['A','B'] : ['A','B','V']);
  r.nalog   = r.lvl === 1 ? 'Рекомендуется' : 'Обязательна (п. 12.5)';
  r.vyezd   = r.lvl === 1 ? 'Не требуется'
            : r.lvl === 2 ? 'По решению комплаенс-менеджера'
            : 'Обязателен для нового подрядчика, крупной подрядной сделки либо при сомнениях в ресурсах; для ранее проверенного — по решению КМ или техзаказчика. С фотофиксацией и актом осмотра';

  /* --- квалификации из чек-листа и Приложения № 6 --- */
  const abs = [], over = [], flag = [];
  r.scope.forEach(n=>{
    const c = S.cl[n];
    if(!c || !c.q || c.q==='ok') return;
    const item = CHECKLIST.find(x=>x.n===n);
    const rec = {src:`Чек-лист, поз. ${n}`, t:item.t, why:c.note||''};
    if(c.q==='abs') abs.push(rec); else if(c.q==='over') over.push(rec); else flag.push(rec);
  });
  CRIT.forEach(c=>{
    const q = S.crit[c.n];
    if(!q || q==='no') return;
    const rec = {src:`Приложение № 6, п. ${c.n}`, t:c.t, why:(S.crit[c.n+'_why']||'')};
    if(q==='abs') abs.push(rec); else if(q==='over') over.push(rec); else flag.push(rec);
  });
  (S.flags||[]).forEach(n=>{
    const f = FLAGS.find(x=>x.n===n);
    if(f) flag.push({src:`Приложение № 6, красный флаг ${n}`, t:f.t, why:(S.flagWhy && S.flagWhy[n]) || ''});
  });
  r.abs = abs; r.over = over; r.flag = flag;

  /* --- профильные мнения (п. 6.4) --- */
  const need = [];
  if(r.lvl===3) need.push({d:'Юридический департамент', why:'углублённый уровень риска'});
  else if(abs.length||over.length) need.push({d:'Юридический департамент', why:'выявлен стоп-фактор'});
  const finFlag = r.scope.some(n=>{ const c=S.cl[n]; const it=CHECKLIST.find(x=>x.n===n); return it && it.fin && c && c.q && c.q!=='ok'; });
  if(r.lvl===3) need.push({d:'Финансовый департамент', why:'углублённый уровень риска'});
  else if(S.intragroup || r.excl==='intragroup') need.push({d:'Финансовый департамент', why:'внутригрупповая сделка'});
  else if(finFlag) need.push({d:'Финансовый департамент', why:'красные флаги налогового или финансового характера'});
  if(r.lvl===3 && (sj.sk || sj.teh)) need.push({d:'Технический заказчик', why:'подряд, проектирование или поставка оборудования при углублённом уровне'});
  r.need = need;

  /* --- меры митигации --- */
  const groups = new Set();
  (S.flags||[]).forEach(n=>{ const f=FLAGS.find(x=>x.n===n); if(f) groups.add(f.m); });
  if(S.affil || S.crit[13] && S.crit[13]!=='no') groups.add('AFF');
  if(S.foreign) groups.add('FOR');
  if(r.lvl>=2) groups.add('TAX');
  if(S.age==='<1' || S.noexp) groups.add('NEW');
  r.mit = [...groups].map(g=>({g, t:MIT[g]}));

  r.done = r.scope.filter(n=>S.cl[n] && S.cl[n].q).length;

  /* --- вывод (п. 7.9) --- */
  if(r.skip){
    r.verdict = 'skip';
    r.verdictText = 'Комплаенс-проверка не требуется';
  } else if(abs.length){
    r.verdict = 'neg';
    r.verdictText = 'Отрицательное. Абсолютный стоп-фактор';
    r.verdictWhy = 'Заключение договора не допускается до устранения обстоятельства либо прекращения установленного законом запрета. Управленческим решением по п. 8.3 абсолютный стоп-фактор не преодолевается.';
  } else if(over.length){
    r.verdict = 'neg';
    r.verdictText = 'Отрицательное либо с условиями. Преодолимый стоп-фактор';
    r.verdictWhy = 'Передача договора на согласование допускается после устранения фактора либо по письменному мотивированному решению уполномоченного лица (п. 8.3).';
    r.needP83 = true;
    r.needPartner = r.lvl===3 || over.length>=2;
  } else if(r.done < r.scope.length){
    r.verdict = 'draft';
    r.verdictText = 'Проверка не завершена';
    r.verdictWhy = `Заполнено ${r.done} позиций чек-листа из ${r.scope.length}. Непроведение проверки в срок не означает положительного Заключения и не позволяет запускать договор на согласование (п. 8.6).`;
  } else if(flag.length || r.mit.length){
    r.verdict = 'cond';
    r.verdictText = 'С условиями (митигация)';
    r.verdictWhy = 'Контрагент допускается к заключению договора при включении в него условий, указанных в Заключении.';
  } else {
    r.verdict = 'ok';
    r.verdictText = 'Без замечаний';
    r.verdictWhy = 'Контрагент допускается к заключению договора на стандартных условиях.';
  }

  /* --- обоснования (Приложение № 5: оценочные понятия не применяются автоматически) --- */
  r.missing = [];
  r.scope.forEach(n=>{
    const c = S.cl[n];
    if(c && c.q && c.q!=='ok' && !(c.note||'').trim()) r.missing.push(`поз. ${n} чек-листа`);
  });
  CRIT.forEach(c=>{ const q=S.crit[c.n]; if(q && q!=='no' && !((S.crit[c.n+'_why']||'').trim())) r.missing.push(`Прил. № 6, п. ${c.n}`); });

  r.validUntil = S.date ? addMonths(S.date, r.valid) : '';
  r.received = S.received || (S.fromInit && S.fromInit.at) || S.date || today();
  r.deadline = addWorkdays(r.received, r.days);
  r.late = !r.skip && r.deadline < today() && r.verdict === 'draft';
  return r;
}

/* ====================== рендер: шаги ====================== */
const STEPS = ['Сделка','Запрос документов','Чек-лист','Стоп-факторы','Митигация','Заключение'];
const INIT_STEPS = 2;   /* инициатору доступны «Сделка» и «Запрос документов» */
function renderSteps(){
  const r = calc();
  document.getElementById('steps').innerHTML = STEPS.map((t,i)=>{
    const n=i+1;
    if(ROLE==='init' && n>INIT_STEPS) return '';
    let done=false;
    if(n===1) done = !!(S.cp && S.subj && (S.sum || r.exclSkip));
    if(n===2) done = step>2;
    if(n===3) done = r.done === r.scope.length && r.scope.length>0;
    if(n===4) done = step>4;
    if(n===5) done = step>5;
    return `<button class="step ${done?'done':''}" data-step="${n}" aria-current="${step===n}"><span class="num">${done?'✓':n}</span>${t}</button>`;
  }).join('');
}

/* ====================== подсказки по данным автопроверки ======================
   Приложение ничего не квалифицирует само: оно показывает факт, называет позицию Приложения № 6,
   к которой этот факт относится, и даёт отметить её одним нажатием. Решение — за комплаенс-менеджером. */
function autoHints(){
  const a = S.auto && S.auto.inn === digits(S.inn) ? S.auto : null;
  const r = calc(), out = [];
  const flag = (n, why)=>{ if(!(S.flags||[]).includes(n)) out.push({kind:'flag', n, t:(FLAGS.find(f=>f.n===n)||{}).t, why}); };
  const crit = (n, why)=>{ const cur = S.crit[n]; if(!cur || cur==='no') out.push({kind:'crit', n, t:(CRIT.find(c=>c.n===n)||{}).t, why}); };
  if(S.age === '<1') flag(1, a && a.egrul ? `по ЕГРЮЛ зарегистрирован ${a.egrul.reg}` : 'срок деятельности менее года');
  if(!a) return out;
  const p = a.pb;
  if(p){
    if(p.staff !== null && p.staff <= 1) flag(2, `среднесписочная численность за ${p.staffYear} год — ${p.staff}`);
    if(p.massAddr > 0) flag(4, `«Прозрачный бизнес» относит адрес к адресам массовой регистрации`);
    const OKV_SUPPLY = ['45','46','47'].concat(Array.from({length:24},(_,i)=>String(10+i)));
    const OKV = {podryad:['41','42','43'], tehzak:['41','42','43','71'], proekt:['71'], 'postavka-reg':OKV_SUPPLY, 'postavka-raz':OKV_SUPPLY, oborud:OKV_SUPPLY, arenda:['68','77']};
    if(p.okved && OKV[r.subj.v] && !OKV[r.subj.v].includes(p.okved.slice(0,2))) flag(3, `основной ОКВЭД ${p.okved} (${p.okvedName}) не относится к предмету договора «${r.subj.t}»`);
    (p.heads||[]).filter(h=>h.cnt > 10).forEach(h=>crit(4, `${h.name} значится руководителем в ${h.cnt} организациях`));
    (p.founders||[]).filter(f=>f.cnt > 10).forEach(f=>crit(4, `${f.name} значится учредителем в ${f.cnt} организациях`));
    if(p.capital > 0 && p.capital <= 10000 && r.sum > (r.org.base||0) && r.org.base) flag(6, `уставный капитал ${money(p.capital)} ₽ при сумме сделки ${money(r.sum)} ₽`);
    const f = p.fin[0];
    if(a.bo && a.bo.payablesPrev > 0 && a.bo.payables !== null && a.bo.payables >= 1.5 * a.bo.payablesPrev)
      flag(7, `кредиторская задолженность выросла с ${money(a.bo.payablesPrev)} ₽ до ${money(a.bo.payables)} ₽ за ${a.bo.year} год (ГИР БО)`);
    if(a.bo && ((a.bo.net !== null && a.bo.net < 0) || (a.bo.profit !== null && a.bo.profit < 0)))
      flag(7, [a.bo.profit < 0 ? `убыток за ${a.bo.year} год — ${money(-a.bo.profit)} ₽` : '', a.bo.net < 0 ? `капитал и резервы отрицательные: ${money(a.bo.net)} ₽` : ''].filter(Boolean).join('; ') + ' (ГИР БО)');

}
function hintsCard(){
  const hs = autoHints();
  if(!hs.length) return '';
  return `<div class="card" style="border-color:var(--warn)">
    <div class="hd"><h2>Подсказки по данным автопроверки</h2><span class="ref">решение за вами</span></div>
    <p class="small muted" style="margin-top:0">Приложение нашло факты, которые подходят под позиции Приложения № 6. Отметить или нет — решаете вы: основание подставится в обоснование, его можно поправить.</p>
    ${hs.map(h=>`<div class="rq"><div class="body"><b>${h.kind==='flag'?'Красный флаг':'Критический фактор'} ${h.n}.</b> ${esc(h.t||'')}<div class="hint" style="color:var(--warn)">${esc(h.why)}</div></div>
      <button class="btn" style="flex:0 0 auto" data-hint="${h.kind}:${h.n}">Отметить</button></div>`).join('')}
  </div>`;
}
function takeHint(key){
  const [kind, nStr] = key.split(':'), n = Number(nStr);
  const h = autoHints().find(x=>x.kind===kind && x.n===n); if(!h) return;
  if(kind === 'flag'){
    S.flags = S.flags || []; if(!S.flags.includes(n)) S.flags.push(n);
    S.flagWhy = S.flagWhy || {}; S.flagWhy[n] = `По данным автопроверки ${stamp(S.auto ? S.auto.at : new Date().toISOString())}: ${h.why}.`;
  }
  else {
    const c = CRIT.find(x=>x.n===n);
    S.crit[n] = c.def;
    if(!(S.crit[n+'_why']||'').trim()) S.crit[n+'_why'] = `По данным автопроверки ${stamp(S.auto.at)}: ${h.why}.`;
  }
  render();
}

/* ====================== загрузка договора ======================
   Файл разбирается в браузере и никуда не отправляется. Из текста достаются стороны, ИНН,
   ОГРН, сумма, аванс и предмет; найденное подставляется в сделку, после чего — если стоит
   расширение — запускается автопроверка. Разбор эвристический: результат показывается
   человеку, и всё, что подставлено, остаётся редактируемым. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let docInfo = null;      /* что нашли в последнем загруженном договоре; в черновик не пишется */
let docBusy = false;

async function unzipEntry(buf, name){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let i = u8.length - 22;
  while(i >= 0 && dv.getUint32(i, true) !== 0x06054b50) i--;
  if(i < 0) throw new Error('файл повреждён или это не .docx');
  const n = dv.getUint16(i+10, true); let p = dv.getUint32(i+16, true);
  for(let k = 0; k < n && dv.getUint32(p, true) === 0x02014b50; k++){
    const method = dv.getUint16(p+10, true), csize = dv.getUint32(p+20, true);
    const nl = dv.getUint16(p+28, true), el = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true), lho = dv.getUint32(p+42, true);
    if(new TextDecoder().decode(u8.subarray(p+46, p+46+nl)) === name){
      const start = lho + 30 + dv.getUint16(lho+26, true) + dv.getUint16(lho+28, true);
      const data = u8.subarray(start, start + csize);
      if(method === 0) return data;
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    p += 46 + nl + el + cl;
  }
  throw new Error('в файле нет текста документа');
}
function xmlText(x){
  return x.replace(/<\/w:p>/g, '\n').replace(/<w:(tab|br)\b[^>]*\/>/g, ' ').replace(/<[^>]+>/g, '')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
}
async function docxText(buf){
  const xml = new TextDecoder().decode(await unzipEntry(buf, 'word/document.xml'));
  /* таблица из двух столбцов (обычно реквизиты сторон) читается по столбцам: тогда наименование, ИНН и ОГРН
     каждой стороны идут подряд, а не вперемешку построчно; остальные таблицы — построчно */
  const withTables = xml.replace(/<w:tbl>[\s\S]*?<\/w:tbl>/g, tbl=>{
    const rows = [...tbl.matchAll(/<w:tr\b[\s\S]*?<\/w:tr>/g)].map(m=>[...m[0].matchAll(/<w:tc\b[\s\S]*?<\/w:tc>/g)].map(c=>xmlText(c[0]).trim()));
    if(rows.length >= 2 && rows.every(r=>r.length === 2)) return '\n' + rows.map(r=>r[0]).join('\n') + '\n\n' + rows.map(r=>r[1]).join('\n') + '\n';
    return '\n' + rows.map(r=>r.join(' \t ')).join('\n') + '\n';
  });
  return xmlText(withTables);
}
function loadScript(src){
  return new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = ()=>rej(new Error('не удалось загрузить модуль чтения PDF — проверьте интернет')); document.head.appendChild(s); });
}
async function pdfText(buf){
  if(!window.pdfjsLib){ await loadScript(PDFJS + 'pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; }
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  const out = [];
  for(let n = 1; n <= Math.min(pdf.numPages, 80); n++){
    const tc = await (await pdf.getPage(n)).getTextContent();
    let line = '', y = null;
    tc.items.forEach(it=>{ const iy = it.transform ? Math.round(it.transform[5]) : y; if(y !== null && Math.abs(iy - y) > 3){ out.push(line); line = ''; } line += (line && !/\s$/.test(line) ? ' ' : '') + it.str; y = iy; });
    out.push(line);
  }
  const text = out.join('\n');
  if(text.replace(/\s/g,'').length < 200) throw new Error('в PDF нет текстового слоя — похоже, это скан. Загрузите договор в .docx или текстовый PDF');
  return text;
}

const ORG_FORM = '(?:Общество\\s+с\\s+ограниченной\\s+ответственностью|Публичное\\s+акционерное\\s+общество|Непубличное\\s+акционерное\\s+общество|Закрытое\\s+акционерное\\s+общество|Открытое\\s+акционерное\\s+общество|Акционерное\\s+общество|ООО|ПАО|НАО|ЗАО|ОАО|АО)';
function normName(t){ const m = String(t||'').match(/[«"“„]([^»"”“]+)[»"”]/); return (m ? m[1] : String(t||'')).toLowerCase().replace(/[^a-zа-яё0-9]+/g,''); }
function shortForm(t){
  return t.replace(/Общество\s+с\s+ограниченной\s+ответственностью/i,'ООО').replace(/Публичное\s+акционерное\s+общество/i,'ПАО')
          .replace(/Непубличное\s+акционерное\s+общество/i,'НАО').replace(/Закрытое\s+акционерное\s+общество/i,'ЗАО')
          .replace(/Открытое\s+акционерное\s+общество/i,'ОАО').replace(/Акционерное\s+общество/i,'АО')
          .replace(/Индивидуальный\s+предприниматель/i,'ИП').replace(/\s+/g,' ').trim()
          .replace(/^([^«"“„]*)[«"“„](.*)[»"”]$/, (m, form, inner)=>{
            /* вложенное название: ОАО "АК "ТРАНСАЭРО" -> ОАО «АК «ТРАНСАЭРО»» */
            const odd = (inner.match(/["“„”]/g)||[]).length % 2 === 1;
            let open = true;
            inner = inner.replace(/["“„”]/g, ()=>{ const q = open ? '«' : '»'; open = !open; return q; });
            return form + '«' + inner + (odd ? '»' : '') + '»';
          });
}
function parseMoney(t){ return Number(String(t).replace(/[\s ]/g,'').replace(',','.')) || 0; }

function parseContract(raw){
  const text = raw.replace(/ /g,' ').replace(/[ \t]+/g,' ');
  const head = text.slice(0, 2500), low = text.toLowerCase();
  const r = {parties:[], sum:0, avans:null, prepay100:false, subj:'', num:'', date:'', notes:[]};

  /* стороны: наименования из преамбулы, ИНН и ОГРН — откуда найдутся */
  const names = [];
  /* кавычки бывают вложенными («АК «Трансаэро», "Компания "Ромашка"), поэтому название берётся
     до закрывающей кавычки, после которой идёт запятая, скобка, «именуемое», «в лице» или реквизит */
  const reOrg = new RegExp(ORG_FORM + '(?:\\s+[А-ЯЁ][А-ЯЁа-яё-]+){0,4}\\s*[«"“„][^\\n]{2,140}?[»"”](?=\\s*(?:[,(;.]|именуем|в\\s+лице|ИНН|КПП|ОГРН|адрес|$|\\n))', 'gi');

  /* физическое лицо: «гражданин РФ Иванов Иван Иванович» либо Ф.И.О., за которым идут паспорт, дата рождения, ИНН или «именуемый» */
  const rePerson = /(?:гражданин(?:ка)?\s+(?:РФ|Российской\s+Федерации)?\s*,?\s*)?([А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?\s+[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+(?:\s+(?:оглы|кызы|улы))?)(?=\s*,?\s*(?:\d{2}\.\d{2}\.\d{4}|паспорт|дата\s+рождения|\d{2}\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)|ИНН|СНИЛС|именуем|зарегистрирован|пол\b))/g;
  [reOrg, reIp].forEach(re=>{ let m; while((m = re.exec(text))) names.push({t:shortForm(m[0]), at:m.index, end:m.index + m[0].length}); });
  { let m; while((m = rePerson.exec(text))){ const t = m[1].replace(/\s+/g,' '); const at = m.index + m[0].indexOf(m[1]);
      /* Ф.И.О. внутри уже найденного «Индивидуальный предприниматель …» второй раз не берётся */
      if(!/^(Общество|Публичное|Акционерное|Закрытое|Открытое|Российская)/.test(t) && !names.some(n=>n.at <= at && at < n.end)) names.push({t, at, end:m.index + m[0].length, person:true}); } }
  names.sort((a,b)=>a.at-b.at);
  /* роль стороны — «именуемое в дальнейшем «Подрядчик»» сразу после наименования */
  names.forEach((n, i)=>{
    /* роль ищется только до следующего упоминания стороны, иначе роль второй стороны достаётся первой */
    const stop = Math.min(n.end + 160, names[i+1] ? names[i+1].at : Infinity);
    const m = text.slice(n.end, stop).match(/именуем\S*(?:\s+в\s+дальнейшем)?\s*[«"“]?\s*([А-ЯЁа-яё-]{4,})/i);
    if(m) n.role = m[1].replace(/^./, c=>c.toUpperCase());
  });
  const uniqNames = []; names.forEach(n=>{ const u = uniqNames.find(x=>normName(x.t)===normName(n.t)); if(!u) uniqNames.push(Object.assign({}, n)); else if(!u.role && n.role) u.role = n.role; });
  const roleOf = t => (uniqNames.find(x=>normName(x.t)===normName(t))||{}).role || '';

  const inns = []; { const re = /ИНН(?:\s*\/\s*КПП)?[\s:№]*?(\d{12}|\d{10})(?!\d)/gi; let m; while((m = re.exec(text))) if(!inns.find(x=>x.v===m[1])) inns.push({v:m[1], at:m.index}); }
  const ogrns = []; { const re = /ОГРН(?:ИП)?[\s:№]*?(\d{15}|\d{13})(?!\d)/gi; let m; while((m = re.exec(text))) if(!ogrns.find(x=>x.v===m[1])) ogrns.push({v:m[1], at:m.index}); }

  /* наименование к ИНН — ближайшее упоминание перед ним (в реквизитах ИНН идёт после названия);

  if(!r.parties.length) uniqNames.filter(n=>!ORGS.find(o=>normName(o.name)===normName(n.t))).slice(0,2).forEach(n=>r.parties.push({inn:'', ogrn:'', name:n.t, mine:null}));
  r.parties.forEach(p=>{ p.role = roleOf(p.name); if(!p.mine && p.name && ORGS.find(o=>normName(o.name)===normName(p.name))) p.mine = ORGS.find(o=>normName(o.name)===normName(p.name)); });
  /* банк, упомянутый в договоре (эскроу, расчёты, гарантия), стороной не является — если без него остаются двое */
  const banks = r.parties.filter(p=>/банк/i.test(p.name||'') && !/^(заёмщик|заемщик|кредитор|гарант|банк)$/i.test(p.role||'') && !p.mine);

  /* номер и дата */
  let m = head.match(/ДОГОВОР[^№]{0,120}№\s*([^\s,;]+)/i); if(m) r.num = m[1].replace(/[_]+/g,'').slice(0,40);
  /* дата договора — в шапке, не раньше 2010 года: иначе первой попадается дата рождения или выдачи паспорта из преамбулы */
  const yNow = new Date().getFullYear();
  const dates = [...head.slice(0, 1500).matchAll(/[«"]?(\d{1,2})[»"]?\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+(\d{4})|(\d{2})\.(\d{2})\.(\d{4})/gi)];
  const okDate = dates.find(x=>{ const y = Number(x[3] || x[6]); return y >= 2010 && y <= yNow + 1; });
  if(okDate) r.date = okDate[0].replace(/[«»"]/g,'');

  /* цена */
  m = text.match(/(?:цена|стоимость|сумма)[^.;\n]{0,160}?(\d{1,3}(?:[ ]\d{3})+(?:[.,]\d{2})?|\d{4,}(?:[.,]\d{2})?)\s*(?:\(|руб|₽)/i);
  if(m) r.sum = parseMoney(m[1]);
  if(!r.sum){ let best = 0, mm; const re = /(\d{1,3}(?:[ ]\d{3})+(?:[.,]\d{2})?|\d{5,}(?:[.,]\d{2})?)\s*(?:\([^)]{0,200}\)\s*)?руб/gi; while((mm = re.exec(text))) best = Math.max(best, parseMoney(mm[1])); r.sum = best; if(best) r.notes.push('цена взята как наибольшая сумма в рублях — проверьте'); }

  /* аванс */
  m = text.match(/(?:аванс|предоплат|предварительн\S*\s+оплат)[^.;\n]{0,140}?(\d{1,3})\s*(?:\([^)]{0,60}\)\s*)?(?:%|процент)/i)
   || text.match(/(\d{1,3})\s*(?:\([^)]{0,60}\)\s*)?(?:%|процент)\S*[^.;\n]{0,80}?(?:аванс|предоплат)/i);
  if(m){ const v = Number(m[1]); if(v > 0 && v <= 100) r.avans = v; }

  /* предмет */
  const zone = (head + ' ' + (text.match(/предмет\s+договора[\s\S]{0,900}/i)||[''])[0]).toLowerCase();
  const has = re => re.test(zone);
  r.subj = has(/долевого\s+участия|участи[яе]\s+в\s+долевом\s+строительстве|долевом\s+строительстве/) ? 'nedvizh'
    : has(/техническ\S+\s+заказчик/) ? 'tehzak'
    : has(/проектн|изыскат|проектно-сметн/) ? 'proekt'
    : has(/подряд|строительно-монтаж|\bсмр\b|выполнени\S+\s+работ/) ? 'podryad'
    : has(/займ|заём|кредит|залог|поручительств|уступк/) ? 'zaim'
    : has(/купли-продажи/) && has(/недвижим|земельн|помещени|здани/) ? 'nedvizh'
    : has(/инвестиционн|совместн\S+\s+деятельност|простого\s+товариществ/) ? 'sovm'
    : has(/аренд/) ? 'arenda'
    : has(/поставк/) && has(/оборудовани/) ? 'oborud'
    : has(/поставк|купли-продажи/) ? 'postavka-reg'
    : has(/самозанят|налог\S*\s+на\s+профессиональный\s+доход/) ? 'samozan'
    : has(/услуг|агентск|консультац/) ? 'uslugi' : '';
  r.chars = text.length;
  return r;
}

function applyParty(i){
  if(!docInfo) return;
  const p = docInfo.parties[i]; if(!p) return;
  docInfo.picked = i;
  if(p.inn) S.inn = p.inn;
  if(p.ogrn) S.ogrn = p.ogrn; else S.ogrn = '';
  if(p.name) S.cp = p.name;
  S.cpDoc = ''; S.auto = null; autoErr = '';
  render();
  if(extVersion() && [10,12].includes(digits(S.inn).length)) autoCheck();
}

async function loadContract(file){
  docBusy = true; docInfo = null; render();
  try{
    const ext = (file.name.split('.').pop()||'').toLowerCase();
    const buf = await file.arrayBuffer();
    let text;
    if(ext === 'docx') text = await docxText(buf);
    else if(ext === 'pdf') text = await pdfText(buf);
    else if(ext === 'txt') text = new TextDecoder().decode(buf);
    else throw new Error(ext === 'doc' || ext === 'rtf' ? 'старый формат .' + ext + ' не читается — сохраните договор как .docx или PDF' : 'поддерживаются .docx, .pdf и .txt');
    const r = parseContract(text);
    docInfo = Object.assign(r, {file:file.name});
    /* новый договор — новая сделка: от прежней остаются только организация, инициатор и даты,
       иначе аванс, ОГРН, договоры, отметки чек-листа и итоги автопроверки переезжают в новую проверку */
    const keep = {org:S.org, orgText:S.orgText, initiator:S.initiator, date:S.date, received:S.received, km:S.km, fromInit:S.fromInit};
    S = Object.assign(blank(), keep);
    egrulPdf = ''; egrulPdfInn = ''; autoErr = ''; fsspWait = false; S.cpDoc = '';
    const mine = r.parties.find(p=>p.mine); if(mine) S.org = mine.mine.id;
    if(r.subj) S.subj = r.subj;
    if(r.sum) S.sum = String(r.sum);
    if(r.avans){ S.pay = 'avans'; S.avans = String(r.avans); }
    S.dogovor = [r.num && '№ ' + r.num, r.date && 'от ' + r.date].filter(Boolean).join(' ');
    const others = r.parties.filter(p=>!p.mine);
    docBusy = false;
    r.pickedWhy = '';
    if(others.length === 1) applyParty(r.parties.indexOf(others[0]));
    else {
      /* организации Группы в договоре не узнаны — выбираем по роли: контрагент обычно подрядчик,
         поставщик, исполнитель, а не заказчик или покупатель; если по ролям не ясно — спрашиваем */
      const cpRole = /^(суб|ген)?подрядчик|поставщик|исполнитель|проектировщик|арендодател|продавец|лизингодател|агент|перевозчик|экспедитор|подрядн|участник|дольщик|цессионар|инвестор/i;
      const ourRole = /^заказчик|покупател|арендатор|застройщик|лизингополучател|принципал|клиент/i;
      const byRole = others.filter(p=>cpRole.test(p.role||''));
      const notOurs = others.filter(p=>!ourRole.test(p.role||''));
      const chosen = byRole.length === 1 ? byRole[0] : (notOurs.length === 1 ? notOurs[0] : null);
      if(chosen){ r.pickedWhy = `в договоре «${chosen.role}» — контрагент выбран по роли, организация Группы в справочнике не найдена`; applyParty(r.parties.indexOf(chosen)); }
      else render();
    }
    toast('Договор прочитан');
  }catch(e){
    docBusy = false; docInfo = {error:String((e && e.message) || e), file:file.name, parties:[]}; render();
  }
}

    ${!d.parties.length ? `<div class="verdict v-cond" style="margin:10px 0 0"><b>Стороны не найдены</b>В тексте нет ни ИНН, ни наименований в привычном виде. Заполните контрагента вручную.</div>` : ''}
    ${d.bankNote ? `<div class="hint">${esc(d.bankNote)} — банк, упомянутый в договоре; стороной не считается.</div>` : ''}

function dealMissing(){
  const r = calc(), m = [];
  if(!org().id && !S.orgText.trim()) m.push('организация Группы');
  if(!S.initiator.trim()) m.push('инициатор');
  if(!S.cp.trim()) m.push('наименование контрагента');
  if(![10,12].includes(digits(S.inn).length)) m.push('ИНН (10 или 12 цифр)');
  if(!S.subj) m.push('предмет договора');
  if(!r.exclSkip){
    if(!r.own) m.push('сумма договора');
    if(!S.hasContracts) m.push('ответ о действующих договорах');
    if(S.hasContracts==='yes' && !r.contracts.length) m.push('хотя бы один действующий договор');
  }
  return m;
}

function reqItems(){
  const r = calc(), out = [];
  r.blocks.forEach(b=>DOCS[b].forEach((d,i)=>{

    let on = d.on;
    if(d.deep && r.lvl===3) on = true;
    if(d.sk && !r.subj.sk) on = false;
    if(S.req.sel[key] !== undefined) on = !!S.req.sel[key];
    const t = S.req.edit[key] !== undefined ? S.req.edit[key] : d.t;
    out.push({key, block:b, on, t, km:d.km, anketa:!!d.anketa, edited:S.req.edit[key]!==undefined});
  }));
  return out;
}
function reqLines(){
  const list = reqItems().filter(x=>x.on && x.t.trim()).map(x=>x.t.trim());
  (S.req.extra||[]).forEach(x=>{ if((x.t||'').trim()) list.push(x.t.trim()); });

/* ====================== автопроверка: суды, банкротство, приставы ======================
   Картотека арбитражных дел, ЕФРСБ и ФССП не отвечают странице с чужого адреса, поэтому
   запросы выполняет расширение для Chrome (папка extension/ в репозитории): оно открывает
   сайт-источник в фоновой вкладке браузера комплаенс-менеджера и забирает ответ оттуда.
   Сторонних сервисов и ключей нет. Капчу ФССП вводит человек. */
const AUTO_MARK = 'Автопроверка';
const EXT_ZIP = 'https://github.com/mazurovmikhail-ui/komplaens-kontragent/archive/refs/heads/main.zip';
let autoBusy = false, autoErr = '', fsspWait = false, extSeq = 0;
let egrulPdf = '', egrulPdfInn = '';   /* выписка ЕГРЮЛ в PDF (base64) — только в памяти вкладки, в черновик не пишется */
function downloadB64(name, b64, mime){
  try{
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], {type:mime})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }catch(e){ toast('Скачивание недоступно'); }
}
const extWait = {};
function extVersion(){ return document.documentElement.getAttribute('data-kpk-ext') || ''; }
function extTarget(){ return location.origin === 'null' ? '*' : location.origin; }
function extCall(cmd, inn, timeout){
  return new Promise((res, rej)=>{
    const id = ++extSeq;
    const t = setTimeout(()=>{ delete extWait[id]; rej(new Error('расширение не ответило — обновите страницу и повторите')); }, timeout);
    extWait[id] = {res, rej, t};
    window.postMessage({kpk:'req', id, cmd, inn}, extTarget());

window.addEventListener('message', e=>{

  const m = e.data; if(!m || typeof m !== 'object') return;
  if(m.kpk === 'ready'){ render(); return; }
  if(m.kpk === 'res' && extWait[m.id]){
    const w = extWait[m.id]; delete extWait[m.id]; clearTimeout(w.t);
    if(m.ok) w.res(m.data); else w.rej(new Error(m.error || 'расширение вернуло ошибку'));
    return;
  }
  if(m.kpk === 'fssp') takeFssp(m.data);
});

/* ====================== шаг 3 — чек-лист ====================== */
function renderS3(){
  const r = calc();
  const items = r.scope.map(n=>{
    const it = CHECKLIST.find(x=>x.n===n);
    const c = S.cl[n] || {};
    const q = c.q || '';
    const cls = q==='abs'?'f-abs':q==='over'?'f-over':q==='flag'?'f-flag':'';
    const src = it.u
      ? `<a href="${it.u}" target="_blank" rel="noopener noreferrer">${esc(it.s)} ↗</a>`
      : esc(it.s);
    const needNote = q && q!=='ok' && !(c.note||'').trim();
    return `<div class="ci ${cls}">
      <div class="ci-hd"><span class="n">${n}</span><span class="what">${esc(it.t)}</span></div>
      <div class="src">${src}${S.inn?` · <button class="btn ghost" style="padding:1px 7px;font-size:11.5px" data-copyinn="1">копировать ИНН</button>`:''}</div>
      <div class="ctl">
        <span class="seg">
          <label><input type="radio" name="cl${n}" data-cl="${n}" value="ok" ${q==='ok'?'checked':''}><span>соответствует</span></label>
          <label class="w"><input type="radio" name="cl${n}" data-cl="${n}" value="flag" ${q==='flag'?'checked':''}><span>красный флаг</span></label>
          <label class="c"><input type="radio" name="cl${n}" data-cl="${n}" value="over" ${q==='over'?'checked':''}><span>преодолимый стоп-фактор</span></label>
          <label class="c"><input type="radio" name="cl${n}" data-cl="${n}" value="abs" ${q==='abs'?'checked':''}><span>абсолютный стоп-фактор</span></label>
        </span>
      </div>
      <textarea data-note="${n}" placeholder="Фактические показатели, дата и источник выгрузки, мотивированный вывод">${esc(c.note||'')}</textarea>
      ${needNote?`<div class="need">Приложение № 5: оценочные понятия автоматически не применяются — укажите фактические показатели и обоснование.</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('s3').innerHTML = `
  ${autoCard()}
  <div class="card">
    <div class="hd"><h2>Чек-лист комплаенс-проверки</h2><span class="ref">Приложение № 5 · уровень ${LVL_NAME[r.lvl].toLowerCase()} · позиции ${r.scope.length} из 28</span></div>
    <p class="small muted" style="margin-top:0">Все сведения из открытых источников фиксируются выгрузкой в PDF или снимком экрана с указанием источника, даты и времени и приобщаются к комплаенс-досье. Ссылка на источник без сохранённой копии надлежащей фиксацией не признаётся (п. 7.3).</p>
    <div class="btnrow" style="margin-top:6px">
      <button class="btn" data-act="all-ok">Отметить все «соответствует»</button>
      <button class="btn ghost" data-act="clear-cl">Сбросить</button>
    </div>
  </div>
  <div class="card">${items}</div>
  <div class="btnrow">
    <button class="btn ghost" data-go="2">← Запрос документов</button>
    <button class="btn primary" data-go="4">К стоп-факторам →</button>
  </div>`;
}

/* ====================== шаг 4 — стоп-факторы ====================== */
function renderS4(){
  const r = calc();
  const label = {flag:'красный флаг', over:'преодолимый стоп-фактор', abs:'абсолютный стоп-фактор'};
  const crit = CRIT.map(c=>{
    const cur = S.crit[c.n] || 'no';
    const cls = cur==='abs'||cur==='over' ? 'f-over' : cur==='flag' ? 'f-flag' : '';
    const opts = ['no'].concat(c.allow).map(v=>{
      const cl = v==='flag'?'w':(v==='over'||v==='abs')?'c':'';
      const txt = v==='no'?'не выявлено':label[v];
      return `<label class="${cl}"><input type="radio" name="cr${c.n}" data-cr="${c.n}" value="${v}" ${cur===v?'checked':''}><span>${txt}</span></label>`;
    }).join('');
    const needNote = cur!=='no' && !((S.crit[c.n+'_why']||'').trim());
    return `<div class="ci ${cls}">
      <div class="ci-hd"><span class="n">${c.n}</span><span class="what">${esc(c.t)}</span></div>
      <div class="src">${esc(c.q)}</div>
      <div class="ctl"><span class="seg">${opts}</span></div>
      ${cur!=='no'?`<textarea data-crwhy="${c.n}" placeholder="Конкретное основание, применимый запрет либо риск, мотивировка выбранной категории">${esc(S.crit[c.n+'_why']||'')}</textarea>`:''}
      ${needNote?`<div class="need">Примечание к Приложению № 6: комплаенс-менеджер фиксирует конкретное основание и мотивирует выбранную категорию.</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('s4').innerHTML = `
  ${hintsCard()}
  <div class="card">

/* ====================== шаг 6 — заключение ====================== */
function concText(){
  const r = calc(), o = r.org;
  const L = [];
  const nl = ()=>L.push('');
  L.push('ЗАКЛЮЧЕНИЕ КОМПЛАЕНС-МЕНЕДЖЕРА ПО РЕЗУЛЬТАТАМ ПРОВЕРКИ КОНТРАГЕНТА');
  L.push('(Приложение № 7 к Регламенту о порядке проведения комплаенс-проверки контрагентов)');
  nl();
  L.push(`Номер и дата Заключения: ${S.num||'б/н'} от ${rus(S.date)}`);
  L.push(`Организация Группы: ${orgName()}${o.inn?`, ИНН ${o.inn}`:''}`);
  L.push(`Порог проверки и границы уровней: ${money(o.porog)} / ${money(o.base)} / ${money(o.std)} ₽${o.prikaz?` (приказ ${o.prikaz})`:''}`);
  L.push(`Контрагент: ${S.cp||'—'}, ИНН ${S.inn||'—'}${S.ogrn?`, ОГРН ${S.ogrn}`:''}`);
  L.push(`Предмет и сумма договора: ${r.subj.t}${S.dogovor?` (договор ${S.dogovor})`:''}; ${money(r.own)} ₽ с НДС`);
  if(S.hasContracts==='yes' && r.contracts.length){
    L.push(`Действующие договоры с контрагентом (по сведениям инициатора), всего на ${money(r.contractsTotal)} ₽:`);
    r.contracts.forEach((c,i)=>L.push(`  ${i+1}) ${c.org||'организация не указана'} — ${c.what||'реквизиты не указаны'}; ${money(c.sum)} ₽${c.linked?'; взаимосвязан с новой сделкой':''}`));
    if(r.linked) L.push(`Сумма для определения порога и уровня (п. 4.4): ${money(r.sum)} ₽, включая взаимосвязанные договоры на ${money(r.linked)} ₽`);
  } else if(S.hasContracts==='no'){
    L.push('Действующие договоры с контрагентом: по сведениям инициатора отсутствуют');
  }
  L.push(`Условия оплаты: ${S.pay==='fact'?'оплата по факту':S.pay==='cp-prepay'?'предоплата со стороны контрагента':`аванс ${r.avans} %`}; источник финансирования — ${ {own:'собственные средства',project:'проектное финансирование',dolevoe:'средства участников долевого строительства'}[S.fin] }`);
  L.push(`Инициатор: ${S.initiator||'—'}`);
  L.push(`Основание проверки: ${ {new:'новый договор',prolong:'продление, дополнительное соглашение',extra:'внеочередная проверка'}[S.reason] }`);
  L.push(`Присвоенный уровень риска: ${LVL_NAME[r.lvl].toLowerCase()}${r.raised?` (повышен комплаенс-менеджером: ${S.lvlWhy||'обоснование не указано'})`:''}`);
  if(r.p53.length) L.push(`Основания углублённого уровня (п. 5.3): ${r.p53.join('; ')}`);
  nl();
  L.push('1. РЕЗУЛЬТАТЫ ПРОВЕРКИ (позиции чек-листа Приложения № 5)');
  L.push(`Проверенные позиции: ${r.scope.join(', ')}.`);
  r.scope.forEach(n=>{
    const c = S.cl[n]||{}; const it = CHECKLIST.find(x=>x.n===n);
    const q = {ok:'соответствует',flag:'красный флаг',over:'преодолимый стоп-фактор',abs:'абсолютный стоп-фактор'}[c.q] || 'не заполнено';
    L.push(`  ${n}. ${it.t} — ${q}.${(c.note||'').trim()?` ${c.note.trim()}`:''}`);
  });
  if(S.auto && !r.scope.includes(9)){
    const a = S.auto, bits = [];
    if(a.kad) bits.push(`арбитражные дела (kad.arbitr.ru): ответчик — ${a.kad.def.n}, из них за 12 месяцев — ${a.kad.def.nYear}, истец — ${a.kad.pl.n}`);
    if(a.bk) bits.push(`ЕФРСБ: ${a.bk.n ? `записей в реестре должников — ${a.bk.n}` : 'в реестре должников не значится'}`);
    if(a.enf) bits.push(`ФССП: производств — ${a.enf.n}, не окончено — ${a.enf.open} на ${money(a.enf.debt)} ₽`);
    if(bits.length) L.push(`  Дополнительно, вне объёма уровня (автопроверка ${stamp(a.at)}): ${bits.join('; ')}.`);
  }
  nl();
  L.push('2. ПРОФИЛЬНЫЕ МНЕНИЯ ПОДРАЗДЕЛЕНИЙ');
  if(r.need.length) r.need.forEach(n=>L.push(`  ${n.d} — запрошено обязательно (${n.why}). Запрошено ____________, получено ____________. Существо позиции: ____________`));
  else L.push('  Обязательное привлечение не требуется.');
  nl();
  L.push('3. СТОП-ФАКТОРЫ И КРАСНЫЕ ФЛАГИ');
  if(!r.abs.length && !r.over.length && !r.flag.length) L.push('  Не выявлены.');
  r.abs.forEach(x=>L.push(`  Абсолютный стоп-фактор — ${x.t} (${x.src}). ${x.why}`));
  r.over.forEach(x=>L.push(`  Преодолимый стоп-фактор — ${x.t} (${x.src}). ${x.why}`));
  r.flag.forEach(x=>L.push(`  Красный флаг — ${x.t} (${x.src}). ${x.why}`));
  nl();
  L.push('4. ВЫВОД');
  L.push(`  ${r.verdictText}. ${r.verdictWhy||''}`);
  nl();
  L.push('5. ОБЯЗАТЕЛЬНЫЕ К ВКЛЮЧЕНИЮ В ДОГОВОР УСЛОВИЯ (МИТИГАЦИЯ)');
  const chosen = TERMS.map((t,i)=>({t,i})).filter(({i})=> S.terms[i] || (i===0 && r.lvl>=2));
  if(chosen.length) chosen.forEach(({t,i},k)=>L.push(`  ${k+1}. ${t}${(S.terms[i+'_v']||'').trim()?`: ${S.terms[i+'_v'].trim()}`:''}`));
  else L.push('  Не требуются.');
  if(r.mit.length){ nl(); L.push('  Рекомендуемые меры по п. 9.3:'); r.mit.forEach(m=>L.push(`  — ${m.t}`)); }
  nl();
  L.push(`6. СРОК ДЕЙСТВИЯ ЗАКЛЮЧЕНИЯ: до ${rus(r.validUntil)} (${r.valid} мес., п. 9.4)`);
  nl();
  L.push(`Комплаенс-менеджер: ${S.km||'____________________'}    Дата: ${rus(S.date)}    Подпись: ____________`);
  if(r.needP83){
    nl();
    L.push('РЕШЕНИЕ УПОЛНОМОЧЕННОГО ЛИЦА (п. 8.3)');
    L.push(S.decision || '____________________________________________________________________');
    if(r.needPartner) L.push('Требуется дополнительное согласование управляющего партнёра Группы.');
    L.push('Копия решения направляется управляющему партнёру Группы в течение 1 рабочего дня.');
  }
  if(r.abs.length){
    nl();
    L.push('Абсолютный стоп-фактор управленческим решением не преодолевается. Сделка возможна только после устранения обстоятельства либо подтверждения отсутствия установленного законом запрета.');
  }
  return L.join('\n');
}
