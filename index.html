/* ====================== перерисовка ====================== */
function render(){
  if(ROLE==='init'){ if(view==='registry' || view==='orgs') view='check'; if(step>INIT_STEPS) step=1; }
  document.querySelectorAll('#role button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.role===ROLE));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('hidden', ROLE==='init' && (t.dataset.view==='registry' || t.dataset.view==='orgs')));
  ['check','registry','orgs','help'].forEach(v=>{
    document.getElementById('v-'+v).classList.toggle('hidden', v!==view);
  });
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.view===view));
  { const tb = document.querySelector('.tab[data-view="registry"]'), n = regAlerts().total; if(tb) tb.textContent = n ? `Реестр · ${n}` : 'Реестр'; }
  if(view==='check'){
    renderSteps();
    [1,2,3,4,5,6].forEach(n=>document.getElementById('s'+n).classList.toggle('hidden', n!==step));
    if(step===1) renderS1();
    if(step===2) renderReq();
    if(step===3) renderS3();
    if(step===4) renderS4();
    if(step===5) renderS5();
    if(step===6) renderS6();
    renderSide();
  }
  if(view==='registry') renderRegistry();
  if(view==='orgs') renderOrgs();
  if(view==='help') renderHelp();
  save(LS.draft, S);
}

/* ====================== события ====================== */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.f !== undefined){
    const k = t.dataset.f;
    S[k] = (t.type==='checkbox') ? t.checked : t.value;
    if(k==='pay' && t.value!=='avans') S.avans = '';
    if(k==='lvlManual') S.lvlManual = Number(t.value)||0;
    if(['org','subj','pay','fin','age','hist','excl','lvlManual','reason','hasContracts','received','date'].includes(k)) render();
    else {
      renderSide(); renderSteps(); save(LS.draft,S);
      if(!t.closest('#s1-out')) renderS1Out();
      renderHandoff();
    }
    return;
  }
  if(t.dataset.ct !== undefined){
    const c = S.contracts[Number(t.dataset.ct)]; if(!c) return;
    c[t.dataset.k] = t.type==='checkbox' ? t.checked : t.value;
    save(LS.draft,S); renderSide(); renderS1Out(); renderCtTotal(); renderHandoff(); return;
  }
  if(t.dataset.rqe !== undefined || t.dataset.rqx !== undefined) fit(t);
  if(t.dataset.rqe !== undefined){
    S.req.edit[t.dataset.rqe] = t.value; save(LS.draft,S); renderReqPreview();
    const b = document.querySelector(`[data-rqreset="${t.dataset.rqe}"]`); if(b) b.hidden = false;
    return;
  }
  if(t.dataset.rqx !== undefined){ const x = S.req.extra[Number(t.dataset.rqx)]; if(x){ x.t = t.value; save(LS.draft,S); renderReqPreview(); } return; }
  if(t.dataset.rqf !== undefined){ S.req[t.dataset.rqf] = t.value; save(LS.draft,S); renderReqPreview(); return; }
  if(t.dataset.ex !== undefined){
    const x = EXCL[Number(t.dataset.ex)]; if(x){ x[t.dataset.k] = t.value; save(LS.excl,EXCL); }
    return;
  }

  if(t.dataset.note !== undefined){
    const n = t.dataset.note;
    S.cl[n] = Object.assign({}, S.cl[n], {note:t.value});
    save(LS.draft,S); renderSide(); return;
  }
  if(t.dataset.crwhy !== undefined){ S.crit[t.dataset.crwhy+'_why'] = t.value; save(LS.draft,S); return; }
  if(t.dataset.termv !== undefined){ S.terms[t.dataset.termv+'_v'] = t.value; save(LS.draft,S); return; }
  if(t.dataset.org !== undefined){
    const o = ORGS.find(x=>x.id==t.dataset.org);
    if(o){ const k=t.dataset.k; o[k] = ['name','inn','role','prikaz'].includes(k) ? t.value : (Number(t.value)||0); save(LS.orgs,ORGS); }
    return;
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.cl !== undefined){
    S.cl[t.dataset.cl] = Object.assign({}, S.cl[t.dataset.cl], {q:t.value});
    render(); return;
  }
  if(t.dataset.cr !== undefined){ S.crit[t.dataset.cr] = t.value; render(); return; }
  if(t.dataset.flag !== undefined){
    const n = Number(t.dataset.flag);
    S.flags = S.flags || [];
    if(t.checked){ if(!S.flags.includes(n)) S.flags.push(n); }
    else { S.flags = S.flags.filter(x=>x!==n); if(S.flagWhy) delete S.flagWhy[n]; }
    render(); return;
  }
  if(t.dataset.b !== undefined){ S[t.dataset.b] = t.checked; render(); return; }
  if(t.dataset.p46 !== undefined){
    const v = t.dataset.p46; S.p46 = S.p46 || [];
    if(t.checked){ if(!S.p46.includes(v)) S.p46.push(v); } else S.p46 = S.p46.filter(x=>x!==v);
    render(); return;
  }
  if(t.dataset.term !== undefined){ S.terms[t.dataset.term] = t.checked; render(); return; }
  if(t.dataset.rqs !== undefined){ S.req.sel[t.dataset.rqs] = t.checked; render(); return; }
});

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-step],[data-go],[data-act],[data-view],[data-open],[data-del],[data-mon],[data-copyinn],[data-orgdel],[data-role],[data-ctdel],[data-rqreset],[data-rqxdel],[data-exdel],[data-docpick],[data-docrepick],[data-hint]');
  if(!t) return;

  if(t.dataset.role){ ROLE = t.dataset.role; try{ localStorage.setItem(LS.role, ROLE); }catch(err){} render(); return; }
  if(t.dataset.hint !== undefined){ takeHint(t.dataset.hint); return; }
  if(t.dataset.docpick !== undefined){ applyParty(Number(t.dataset.docpick)); return; }
  if(t.dataset.docrepick !== undefined){ if(docInfo){ delete docInfo.picked; docInfo.pickedWhy = ''; } S.cpDoc = ''; render(); return; }
  if(t.dataset.ctdel !== undefined){ S.contracts.splice(Number(t.dataset.ctdel),1); render(); return; }
  if(t.dataset.rqreset !== undefined){ delete S.req.edit[t.dataset.rqreset]; render(); return; }
  if(t.dataset.rqxdel !== undefined){ S.req.extra.splice(Number(t.dataset.rqxdel),1); render(); return; }
  if(t.dataset.exdel !== undefined){ EXCL.splice(Number(t.dataset.exdel),1); save(LS.excl,EXCL); render(); return; }

  if(t.dataset.view){ view = t.dataset.view; render(); return; }
  if(t.dataset.step){ step = Number(t.dataset.step); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.go){ step = Number(t.dataset.go); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.copyinn){ copy(S.inn||''); return; }

  if(t.dataset.open !== undefined){
    const rec = REG[Number(t.dataset.open)];
    if(rec && rec.snapshot){ S = hydrate(JSON.parse(JSON.stringify(rec.snapshot))); view='check'; step=1; render(); toast('Проверка загружена'); }
    return;
  }
  if(t.dataset.del !== undefined){
    REG.splice(Number(t.dataset.del),1); save(LS.reg,REG); render(); return;
  }
  if(t.dataset.orgdel !== undefined){
    ORGS = ORGS.filter(o=>o.id != t.dataset.orgdel);
    if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
    save(LS.orgs,ORGS); render(); return;
  }
  if(t.dataset.mon !== undefined){
    REG[Number(t.dataset.mon)].monitor = today(); save(LS.reg,REG); render(); toast('Мониторинг отмечен'); return;
  }

  const a = t.dataset.act;
  const r = calc();

  if(a==='new'){ S = blank(); autoErr=''; fsspWait=false; docInfo=null; step=1; render(); toast(ROLE==='init'?'Новая сделка':'Новая проверка'); return; }
  if(a==='copy-skip'){ copy(skipSheetText()); return; }
  if(a==='doc-load'){
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.docx,.pdf,.txt';
    inp.onchange = ()=>{ const f = inp.files && inp.files[0]; if(f) loadContract(f); };
    inp.click(); return;
  }
  if(a==='ct-add'){ S.contracts.push({org:'', what:'', sum:'', linked:false}); render(); return; }
  if(a==='deal-link' || a==='deal-file'){
    S.fromInit = {who:S.initiator, at:today()};
    if(!org().id) S.orgText = S.orgText || ''; else S.orgText = org().name;
    const d = JSON.parse(JSON.stringify(S));
    save(LS.draft,S);
    if(a==='deal-link') copy(baseUrl()+'#deal='+pack(d));
    else download(`Сделка_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${today()}.json`, JSON.stringify(d,null,2), 'application/json');
    return;
  }
  if(a==='deal-load'){
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0]; if(!f) return;
      f.text().then(txt=>{ try{ takeDeal(JSON.parse(txt.replace(/^\uFEFF/,''))); }catch(err){ toast('Не удалось разобрать файл сделки'); } });
    };
    inp.click(); return;
  }
  if(a==='init-link'){ copy(baseUrl()+'#init='+pack({orgs:ORGS, excl:EXCL})); return; }
  if(a==='ex-add'){ EXCL.push({inn:'', name:'', kind:'mono'}); save(LS.excl,EXCL); render(); return; }
  if(a==='auto-run'){ autoCheck(); return; }
  if(a==='egrul-pdf'){ downloadB64(`Выписка-ЕГРЮЛ_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${today()}.pdf`, egrulPdf, 'application/pdf'); return; }
  if(a==='fssp-run'){ fsspOpen(); return; }
  if(a==='auto-doc'){ download(`Автопроверка_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${today()}.doc`, autoReportHtml(), 'application/msword'); return; }
  if(a==='rq-add'){ S.req.extra.push({t:''}); render(); const ta = document.querySelector(`[data-rqx="${S.req.extra.length-1}"]`); if(ta) ta.focus(); return; }
  if(a==='rq-reset'){ S.req.sel = {}; S.req.edit = {}; S.req.extra = []; render(); return; }
  if(a==='rq-copy'){ copy(reqText()); return; }
  if(a==='rq-doc'){ download(`Запрос-документов_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${today()}.doc`, reqDocHtml(), 'application/msword'); return; }
  if(a==='rq-mail'){ copy(reqText()); location.href = 'mailto:?subject=' + encodeURIComponent('Запрос документов для заключения договора'); return; }
  if(a==='all-ok'){ r.scope.forEach(n=>{ S.cl[n]=Object.assign({},S.cl[n],{q:'ok'}); }); render(); return; }
  if(a==='clear-cl'){ S.cl = {}; render(); return; }
  if(a==='print'){ window.print(); return; }
  if(a==='copy-concl'){ copy(concText()); return; }
  if(a==='dossier'){
    const nm = (S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-');
    const wrap = t => `<html><head><meta charset="utf-8"></head><body style="font-family:Times New Roman,serif;font-size:12pt"><pre style="white-space:pre-wrap;font-family:Times New Roman,serif">${esc(t)}</pre></body></html>`;
    const files = [[`1_Заключение_${nm}_${S.date}.doc`, wrap(concText())]];
    if(S.auto) files.push([`2_Автопроверка_${nm}_${S.date}.doc`, autoReportHtml()]);
    if(!r.skip) files.push([`3_Запрос-документов_${nm}_${S.date}.doc`, reqDocHtml()]);
    files.push([`4_Данные-проверки_${nm}_${S.date}.json`, JSON.stringify(S,null,2)]);
    files.forEach((f,i)=>setTimeout(()=>download(f[0], f[1], f[0].endsWith('.json')?'application/json':'application/msword'), i*450));
    if(egrulPdf && egrulPdfInn === digits(S.inn)){ files.push(['выписка']); setTimeout(()=>downloadB64(`0_Выписка-ЕГРЮЛ_${nm}_${S.date}.pdf`, egrulPdf, 'application/pdf'), files.length*450); }
    toast(`Файлов в досье: ${files.length}. Если браузер спросит про несколько загрузок — разрешите`);
    return;
  }
  if(a==='doc-concl'){
    const html = `<html><head><meta charset="utf-8"></head><body style="font-family:Times New Roman,serif;font-size:12pt"><pre style="white-space:pre-wrap;font-family:Times New Roman,serif">${esc(concText())}</pre></body></html>`;
    download(`Заключение_${(S.cp||'контрагент').replace(/[^\wа-яА-ЯёЁ]+/g,'-')}_${S.date}.doc`, html, 'application/msword');
    return;
  }
  if(a==='save-reg'){
    if(!S.cp){ toast('Не указан контрагент'); return; }
    const rec = {
      cp:S.cp, inn:S.inn, orgName:orgName(), subject:r.subj.t, sum:r.own,
      contracts: r.contracts.map(c=>`${c.org||'—'}: ${c.what||'—'}, ${money(c.sum)} ₽`).join(' | '),
      lvl:r.lvl, num:S.num, date:S.date, verdict:r.verdictText,
      mitig: TERMS.map((tt,i)=> (S.terms[i]||(i===0&&r.lvl>=2)) ? tt : null).filter(Boolean).join('; '),
      decision: r.needP83 ? (S.decision||'требуется') : '',
      validUntil: r.validUntil, monitor:'', snapshot: JSON.parse(JSON.stringify(S)),
    };
    const ix = REG.findIndex(x=>x.inn===rec.inn && x.num===rec.num && rec.num);
    if(ix>=0) REG[ix] = rec; else REG.unshift(rec);
    save(LS.reg,REG); toast('Внесено в Реестр контрагентов'); return;
  }
  if(a==='csv' || a==='copy-csv'){
    const head = ['№','Контрагент','ИНН','Организация Группы','Предмет','Сумма','Уровень риска','№ Заключения','Дата','Вывод','Меры митигации','Решение по п. 8.3','Действует до','Дата мониторинга','Действующие договоры'];
    const q = s => `"${String(s==null?'':s).replace(/"/g,'""')}"`;
    const csv = [head.map(q).join(';')].concat(REG.map((x,i)=>[i+1,x.cp,x.inn,x.orgName,x.subject,x.sum,LVL_NAME[x.lvl],x.num,rus(x.date),x.verdict,x.mitig,x.decision,rus(x.validUntil),x.monitor?rus(x.monitor):'',x.contracts||''].map(q).join(';'))).join('\r\n');
    if(a==='csv') download('Реестр-комплаенс-проверок.csv', csv, 'text/csv;charset=utf-8');
    else copy(csv);
    return;
  }
  if(a==='export-reg'){ copy(JSON.stringify(REG,null,2)); download('reestr-komplaens.json', JSON.stringify(REG,null,2), 'application/json'); return; }
  if(a==='export-draft'){ copy(JSON.stringify(S,null,2)); download('proverka-'+(S.inn||'draft')+'.json', JSON.stringify(S,null,2), 'application/json'); return; }
  if(a==='import-reg'){
    const txt = prompt('Вставьте JSON реестра:');
    if(!txt) return;
    try{ const d = JSON.parse(txt); if(Array.isArray(d)){ REG = d; save(LS.reg,REG); render(); toast('Реестр загружен'); } else toast('Ожидался массив записей'); }
    catch(err){ toast('Не удалось разобрать JSON'); }
    return;
  }
  if(a==='org-add'){
    const id = ORGS.reduce((m,o)=>Math.max(m,o.id),0) + 1;
    ORGS.push({id, name:'', inn:'', role:'', porog:0, base:0, std:0, taxDebt:0, prikaz:''});
    if(!ORGS.find(o=>o.id==S.org)) S.org = id;
    save(LS.orgs,ORGS); render(); return;
  }
  if(a==='org-export'){
    const j = JSON.stringify({orgs:ORGS, excl:EXCL},null,2);
    copy(j); download('porogi-organizaciy.json', j, 'application/json'); return;
  }
  if(a==='org-import'){
    const txt = prompt('Вставьте JSON справочника организаций:');
    if(!txt) return;
    try{
      const raw = JSON.parse(txt);
      const d = Array.isArray(raw) ? raw : (raw && raw.orgs);
      if(!Array.isArray(d)){ toast('Ожидался справочник организаций'); return; }
      if(raw && Array.isArray(raw.excl)){ EXCL = cleanExcl(raw.excl); save(LS.excl,EXCL); }
      ORGS = d.map((o,i)=>({
        id: Number(o.id)||i+1, name:String(o.name||''), inn:String(o.inn||''), role:String(o.role||''),
        porog:Number(o.porog)||0, base:Number(o.base)||0, std:Number(o.std)||0, taxDebt:Number(o.taxDebt)||0, prikaz:String(o.prikaz||''),
      }));
      if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
      save(LS.orgs,ORGS); render(); toast(`Загружено организаций: ${ORGS.length}`);
    }catch(err){ toast('Не удалось разобрать JSON'); }
    return;
  }
});

/* ====================== приём сделки и настроек по ссылке ====================== */
function cleanOrgs(d){
  return d.map((o,i)=>({ id:Number(o.id)||i+1, name:String(o.name||''), inn:String(o.inn||''), role:String(o.role||''),
    porog:Number(o.porog)||0, base:Number(o.base)||0, std:Number(o.std)||0, taxDebt:Number(o.taxDebt)||0, prikaz:String(o.prikaz||'') }));
}
function cleanExcl(d){
  return d.map(x=>({ inn:String(x.inn||''), name:String(x.name||''), kind:EXCL_NAME[x.kind]?x.kind:'mono' }));
}
function takeDeal(d){
  if(!d || typeof d!=='object' || Array.isArray(d)){ toast('Это не файл сделки'); return; }
  if((S.cp||S.inn) && !confirm('Открыть полученную сделку? Текущий черновик будет заменён.')) return;
  S = hydrate(d);
  /* у комплаенс-менеджера свой справочник: организация ищется по названию, а не по номеру */
  const byName = ORGS.find(o=>o.name && o.name===S.orgText);
  if(byName) S.org = byName.id; else if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
  if(!S.date) S.date = today();
  ROLE = 'km'; try{ localStorage.setItem(LS.role, ROLE); }catch(e){}
  view='check'; step=1; autoErr=''; render(); toast('Сделка от инициатора загружена');
}
function readHash(){
  const h = location.hash || '';
  const m = h.match(/^#(init|deal)=(.+)$/);
  if(!m) return;
  let d; try{ d = unpack(m[2]); }catch(e){ toast('Ссылка повреждена — попросите прислать её заново'); return; }
  history.replaceState(null, '', baseUrl());
  if(m[1]==='deal'){ takeDeal(d); return; }
  if(!d || !Array.isArray(d.orgs)) return;
  if(ROLE==='km' && ORGS.length && !confirm('Ссылка для инициаторов заменит справочник организаций и перечень исключений в этом браузере. Продолжить?')) return;
  ORGS = cleanOrgs(d.orgs); EXCL = cleanExcl(Array.isArray(d.excl)?d.excl:[]);
  save(LS.orgs,ORGS); save(LS.excl,EXCL);
  ROLE = 'init'; try{ localStorage.setItem(LS.role, ROLE); }catch(e){}
  if(!ORGS.find(o=>o.id==S.org)) S.org = ORGS.length ? ORGS[0].id : 0;
  view='check'; step=1;
}
window.addEventListener('hashchange', ()=>{ readHash(); render(); });
readHash();

/* тема */
document.getElementById('theme').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : cur==='light' ? '' : 'dark';
  if(next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem(LS.theme, next); }catch(e){}
});
try{ const th = localStorage.getItem(LS.theme); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}

render();
</script>
